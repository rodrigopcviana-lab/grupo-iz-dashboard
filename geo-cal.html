<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Calibrador de localização · Bar.IZ</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; margin: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, sans-serif; background: #16130f;
    color: #f3ede2; padding: 24px; max-width: 560px; margin: 0 auto; line-height: 1.5; }
  h1 { font-family: Georgia, serif; font-size: 22px; margin-bottom: 6px; }
  p.sub { color: #c3baa9; font-size: 14px; margin-bottom: 18px; }
  .card { background: #211c15; border: 1px solid #3a3428; border-radius: 12px;
    padding: 18px; margin-bottom: 14px; }
  .big { font-size: 26px; font-variant-numeric: tabular-nums; font-weight: 600; }
  .lbl { color: #8f8672; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
  button { width: 100%; padding: 14px; font-size: 15px; font-weight: 600; border: none;
    border-radius: 999px; background: #d0a352; color: #241a06; cursor: pointer; margin-top: 8px; }
  .dist { display: flex; justify-content: space-between; padding: 7px 0;
    border-bottom: 1px solid #2a251c; font-size: 14px; }
  .dist:last-child { border-bottom: none; }
  code { background: #16130f; padding: 2px 6px; border-radius: 6px; font-size: 13px;
    color: #9fe1cb; word-break: break-all; }
  .ok { color: #9fe1cb; } .far { color: #e0b05c; }
</style>
</head>
<body>
<h1>Calibrador de localização</h1>
<p class="sub">Fique parado na porta da casa e espere a precisão baixar de ~20 m.
Depois toque em “Copiar coordenada desta casa” e me mande — ou cole em
<code>config/geofence.json</code>.</p>

<div class="card">
  <div class="lbl">Sua posição agora</div>
  <div class="big" id="pos">aguardando GPS…</div>
  <div class="lbl" style="margin-top:10px">Precisão</div>
  <div id="acc">—</div>
  <button id="copiar">Copiar coordenada desta casa</button>
  <div id="copiado" class="ok" style="margin-top:8px"></div>
</div>

<div class="card">
  <div class="lbl" style="margin-bottom:8px">Distância às casas cadastradas</div>
  <div id="dists">—</div>
</div>

<script>
(function () {
  var LOCAIS = [{"nome": "IZ Restaurante", "lat": -16.6905, "lon": -49.2685, "raio_m": 200}, {"nome": "NIP", "lat": -16.6906, "lon": -49.2684, "raio_m": 200}, {"nome": "1929 Trattoria", "lat": -16.6888, "lon": -49.2712, "raio_m": 200}, {"nome": "Grá Bistrô", "lat": -16.6842, "lon": -49.2626, "raio_m": 200}, {"nome": "FAMU", "lat": -16.7, "lon": -49.256, "raio_m": 200}, {"nome": "Fulles", "lat": -16.7001, "lon": -49.2559, "raio_m": 200}, {"nome": "Enttres", "lat": -16.687, "lon": -49.2648, "raio_m": 200}, {"nome": "DNA Smartstyle (Rodrigo)", "lat": -16.714, "lon": -49.271, "raio_m": 300}];
  var atual = null;
  function metros(a, b, c, d) {
    var R = 6371000, r = Math.PI / 180;
    var dLat = (c - a) * r, dLon = (d - b) * r;
    var x = Math.sin(dLat/2)*Math.sin(dLat/2) +
      Math.cos(a*r)*Math.cos(c*r)*Math.sin(dLon/2)*Math.sin(dLon/2);
    return 2 * R * Math.asin(Math.sqrt(x));
  }
  function render(pos) {
    atual = pos.coords;
    document.getElementById('pos').textContent =
      atual.latitude.toFixed(6) + ', ' + atual.longitude.toFixed(6);
    document.getElementById('acc').textContent = '± ' + Math.round(atual.accuracy) + ' m';
    var html = '';
    LOCAIS.forEach(function (l) {
      var d = metros(atual.latitude, atual.longitude, l.lat, l.lon);
      var cls = d <= l.raio_m ? 'ok' : 'far';
      html += '<div class="dist"><span>' + l.nome + ' <span style="color:#8f8672">(raio ' + l.raio_m + 'm)</span></span><span class="' + cls + '">'
        + (d < 1000 ? Math.round(d) + ' m' : (d/1000).toFixed(1) + ' km') + '</span></div>';
    });
    document.getElementById('dists').innerHTML = html || '—';
  }
  if (navigator.geolocation) {
    navigator.geolocation.watchPosition(render, function () {
      document.getElementById('pos').textContent = 'permita a localização';
    }, { enableHighAccuracy: true, maximumAge: 0, timeout: 20000 });
  } else {
    document.getElementById('pos').textContent = 'sem GPS neste aparelho';
  }
  document.getElementById('copiar').onclick = function () {
    if (!atual) return;
    var txt = '{ "nome": "?", "lat": ' + atual.latitude.toFixed(6)
      + ', "lon": ' + atual.longitude.toFixed(6) + ' }';
    var msg = document.getElementById('copiado');
    if (navigator.clipboard) navigator.clipboard.writeText(txt);
    msg.textContent = 'Copiado: ' + txt;
  };
})();
</script>
</body>
</html>
