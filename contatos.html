<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Contatos | Grupo IZ</title>
<style>
  :root { --bg:#16130f; --card:#211c15; --border:#3a3428; --text:#f3ede2; --text-2:#c3baa9;
          --acc:#d0a352; color-scheme:dark; }
  * { box-sizing:border-box; margin:0; }
  body { font-family:-apple-system,"Segoe UI",Roboto,sans-serif; background:var(--bg); color:var(--text);
         min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .gate { background:var(--card); border:1px solid var(--border); border-radius:14px;
          padding:28px 24px; width:100%; max-width:380px; }
  .kicker { font-size:11px; letter-spacing:.18em; color:var(--acc); margin-bottom:6px; }
  h1 { font-family:Georgia,"Times New Roman",serif; font-size:20px; font-weight:500; margin-bottom:6px; }
  p { font-size:13px; color:var(--text-2); margin-bottom:16px; }
  input[type=password] { font:inherit; font-size:16px; width:100%; padding:11px 12px;
          border:1px solid var(--border); border-radius:8px; margin-bottom:10px;
          background:var(--bg); color:var(--text); }
  label { display:flex; gap:8px; align-items:center; font-size:13px; color:var(--text-2); margin-bottom:14px; }
  label input { accent-color:var(--acc); }
  button { font:inherit; font-size:14px; font-weight:600; width:100%; padding:12px;
           border:none; border-radius:999px; background:var(--acc); color:#241a06; cursor:pointer; }
  button:disabled { opacity:.6; }
  #erro { color:#f09595; font-size:13px; margin-top:10px; display:none; }
</style>
</head>
<body>
<div class="gate">
<div class="kicker">PORTAL DOS BARES · GRUPO IZ</div>
<h1>🔒 Contatos | Grupo IZ</h1>
<p>Área restrita dos chefes de bar. Digite a senha da equipe — a senha de vendas também funciona.</p>
<form id="f">
<input type="password" id="senha" placeholder="Senha" autocomplete="current-password" autofocus>
<label><input type="checkbox" id="lembrar" checked> Lembrar neste aparelho</label>
<button id="btn" type="submit">Entrar</button>
<p id="erro">Senha incorreta — tente de novo.</p>
</form>
</div>

var LS = 'rk_curva_ck';
function b64(s){ var b = atob(s), a = new Uint8Array(b.length); for (var i=0;i<b.length;i++) a[i]=b.charCodeAt(i); return a.buffer; }
function ab2b64(ab){ var a = new Uint8Array(ab), s=''; for (var i=0;i<a.length;i++) s+=String.fromCharCode(a[i]); return btoa(s); }
async function abrir(ckRaw){
  var ck = await crypto.subtle.importKey('raw', ckRaw, 'AES-GCM', false, ['decrypt']);
  var html = new TextDecoder().decode(
    await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(DADOS.ivc)}, ck, b64(DADOS.p)));
  document.open(); document.write(html); document.close();
}
async function tentar(senha){
  var enc = new TextEncoder();
  var km = await crypto.subtle.importKey('raw', enc.encode(senha), 'PBKDF2', false, ['deriveKey']);
  for (var i=0;i<DADOS.slots.length;i++){
    var s = DADOS.slots[i];
    try {
      var kek = await crypto.subtle.deriveKey(
        {name:'PBKDF2', salt:b64(s.salt), iterations:DADOS.it, hash:'SHA-256'},
        km, {name:'AES-GCM', length:256}, false, ['decrypt']);
      return await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(s.iv)}, kek, b64(s.w));
    } catch(e){}
  }
  return null;
}
(function(){
  try {
    var lembrado = JSON.parse(localStorage.getItem(LS) || 'null');
    if (lembrado && lembrado.exp > Date.now()) {
      abrir(b64(lembrado.k)).catch(function(){ localStorage.removeItem(LS); });
    }
  } catch(e){}
})();
document.getElementById('f').addEventListener('submit', async function(ev){
  ev.preventDefault();
  var btn = document.getElementById('btn'), erro = document.getElementById('erro');
  btn.disabled = true; btn.textContent = 'Verificando…'; erro.style.display = 'none';
  var ck = await tentar(document.getElementById('senha').value);
  if (ck) {
    if (document.getElementById('lembrar').checked) {
      try { localStorage.setItem(LS, JSON.stringify({k: ab2b64(ck), exp: Date.now() + 90*24*3600*1000})); } catch(e){}
    }
    await abrir(ck);
  } else {
    btn.disabled = false; btn.textContent = 'Entrar';
    erro.style.display = 'block';
  }
});
