<!DOCTYPE html>
<html class="staticrypt-html" lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <title>Vendas | Grupo IZ</title>
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#16130f" />

        <!-- do not cache this page -->
        <meta http-equiv="cache-control" content="max-age=0" />
        <meta http-equiv="cache-control" content="no-cache" />
        <meta http-equiv="expires" content="0" />
        <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
        <meta http-equiv="pragma" content="no-cache" />

        <style>
            /* Tema "Backbar" do Portal dos Bares — mesmas cores/fontes de
               portal_gen.py e encrypt_dupla.js, para o gate de senha não
               quebrar a identidade visual do resto do site. */
            :root {
                --bg: #16130f; --card: #211c15; --border: #3a3428;
                --text: #f3ede2; --text-2: #c3baa9;
                --acc: #d0a352; --acc-txt: #241a06;
                color-scheme: dark;
            }
            * { box-sizing: border-box; }

            .staticrypt-hr {
                margin-top: 20px;
                margin-bottom: 20px;
                border: 0;
                border-top: 1px solid var(--border);
            }

            .staticrypt-page {
                width: 360px;
                padding: 8% 0 0;
                margin: auto;
                box-sizing: border-box;
            }

            .staticrypt-form {
                position: relative;
                z-index: 1;
                background: var(--card);
                border: 1px solid var(--border);
                max-width: 360px;
                margin: 0 auto 100px;
                padding: 28px 24px;
                text-align: center;
                border-radius: 14px;
                box-shadow: none;
            }

            .staticrypt-kicker {
                font-size: 11px;
                letter-spacing: .18em;
                color: var(--acc);
                margin-bottom: 6px;
                text-align: center;
            }

            .staticrypt-lock {
                width: 20px;
                height: 20px;
                vertical-align: -4px;
                margin-right: 4px;
                color: var(--acc);
            }

            .staticrypt-form input[type="password"],
            input[type="text"] {
                background: var(--bg);
                color: var(--text);
                border: 1px solid var(--border);
                border-radius: 8px;
                box-sizing: border-box; /* This ensures padding is included in the total width */
                font-size: 14px;
                outline: 0;
                padding: 15px 30px 15px 15px; /* Adjust the padding to ensure there is space for the icon */
                width: 100%;
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: var(--bg);
                border: 1px solid var(--border);
                border-radius: 8px;
                width: 100%;
                margin: 0 0 15px;
                box-sizing: border-box;
            }
            .staticrypt-password-container input[type="password"],
            .staticrypt-password-container input[type="text"] {
                border: 0;
                border-radius: 8px;
            }

            .staticrypt-toggle-password-visibility {
                cursor: pointer;
                height: 20px;
                opacity: 70%;
                filter: invert(88%) sepia(8%) saturate(400%);
                padding: 13px;
                position: absolute;
                right: 0;
                top: 50%;
                transform: translateY(-50%);
                width: 20px;
            }

            .staticrypt-form .staticrypt-decrypt-button {
                text-transform: none;
                outline: 0;
                background: var(--acc);
                width: 100%;
                border: 0;
                border-radius: 999px;
                padding: 15px;
                color: var(--acc-txt);
                font-size: 14px;
                font-weight: 600;
                cursor: pointer;
            }

            .staticrypt-form .staticrypt-decrypt-button:hover,
            .staticrypt-form .staticrypt-decrypt-button:active,
            .staticrypt-form .staticrypt-decrypt-button:focus {
                background: var(--acc);
                filter: brightness(92%);
            }

            .staticrypt-html {
                height: 100%;
            }

            .staticrypt-body {
                height: 100%;
                margin: 0;
                background: var(--bg);
            }

            .staticrypt-content {
                height: 100%;
                margin-bottom: 1em;
                background: var(--bg);
                color: var(--text);
                font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
                -webkit-font-smoothing: antialiased;
                -moz-osx-font-smoothing: grayscale;
            }

            .staticrypt-instructions {
                margin-top: -1em;
                margin-bottom: 1em;
            }

            .staticrypt-title {
                font-family: Georgia, "Times New Roman", serif;
                font-size: 20px;
                font-weight: 500;
                color: var(--text);
            }
            .staticrypt-instructions p:last-child {
                font-size: 13px;
                color: var(--text-2);
            }

            label.staticrypt-remember {
                display: flex;
                align-items: center;
                margin-bottom: 1em;
                font-size: 13px;
                color: var(--text-2);
                text-align: left;
            }

            .staticrypt-remember input[type="checkbox"] {
                transform: scale(1.3);
                margin-right: 1em;
                accent-color: var(--acc);
            }

            .hidden {
                display: none !important;
            }

            .staticrypt-spinner-container {
                height: 100%;
                display: flex;
                align-items: center;
                justify-content: center;
                background: var(--bg);
            }

            .staticrypt-spinner {
                display: inline-block;
                width: 2rem;
                height: 2rem;
                vertical-align: text-bottom;
                border: 0.25em solid var(--border);
                border-right-color: var(--acc);
                border-radius: 50%;
                -webkit-animation: spinner-border 0.75s linear infinite;
                animation: spinner-border 0.75s linear infinite;
                animation-duration: 0.75s;
                animation-timing-function: linear;
                animation-delay: 0s;
                animation-iteration-count: infinite;
                animation-direction: normal;
                animation-fill-mode: none;
                animation-play-state: running;
                animation-name: spinner-border;
            }

            @keyframes spinner-border {
                100% {
                    transform: rotate(360deg);
                }
            }

            @media screen and (-webkit-min-device-pixel-ratio: 0) {
                .staticrypt-form input[type="password"],
                input[type="text"] {
                    font-size: 16px;
                }
            }

            @media (max-width: 400px) {
                .staticrypt-page { width: 100%; padding: 14% 16px 0; }
            }
        </style>
    </head>
