<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#F5F2EB">
<title>Prévia da nova versão</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500..700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#F5F2EB;--sup:#FBFAF6;--sup2:#EFEBE2;--linha:#DDD5C6;--tx:#17211D;--tx2:#4C5A54;--tx3:#6E7872;--verde:#1F6B52;--verde-bg:#D3E8DE;--verde-tx:#174F3D;--terra:#B5482F;--terra-bg:#F3DCD2;--terra-tx:#7E2F1C;--ambar:#B7791F;--ambar-bg:#F6E7C8;--ambar-tx:#6B4A0E;--nota-bg:#FBF0E0;--nota-borda:#D9A35B;--faixa:#17211D;--faixa-tx:#EDE8DD;--serif:'Fraunces',Georgia,serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
:root.escuro{--bg:#121A16;--sup:#1A241F;--sup2:#222E28;--linha:#33413A;--tx:#EDE8DD;--tx2:#B9C4BE;--tx3:#8E9993;--verde:#7CCBA9;--verde-bg:#1E3B30;--verde-tx:#A9E2C8;--terra:#EE9C86;--terra-bg:#45261D;--terra-tx:#F6C1B2;--ambar:#E0B062;--ambar-bg:#3D3020;--ambar-tx:#F1D49B;--nota-bg:#2A2419;--nota-borda:#9C7438;--faixa:#0B110E;--faixa-tx:#DCE3DF}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
.ic{flex-shrink:0}
.faixa{background:var(--faixa);color:var(--faixa-tx);padding:10px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:13px}
.faixa b{font-weight:600}
.faixa .perfis{display:flex;gap:6px;flex-wrap:wrap}
.faixa .perfis a{text-decoration:none;padding:4px 10px;border-radius:999px;border:1px solid #4A5A53}
.faixa .perfis a.on{background:var(--faixa-tx);color:var(--faixa);border-color:var(--faixa-tx)}
.faixa .notas{margin-left:auto;display:flex;align-items:center;gap:8px}
.chave{width:34px;height:20px;border-radius:10px;background:#4A5A53;position:relative;transition:background .2s}
.chave::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:8px;background:#fff;transition:transform .2s}
.chave.on{background:#7CCBA9}.chave.on::after{transform:translateX(14px)}
.app{display:flex;min-height:calc(100vh - 44px)}
.lado{display:none}
main{flex:1;min-width:0;padding:0 16px 104px}
.topo{display:flex;align-items:flex-start;gap:12px;padding:20px 0 12px}
.topo .tit{flex:1;min-width:0}
.topo h1{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.1;margin:0}
.topo .sub{color:var(--tx2);font-size:14px;margin-top:4px}
.voltar{display:inline-flex;align-items:center;gap:4px;color:var(--verde);font-weight:600;font-size:14px;margin-bottom:6px}
.btn-ic{width:42px;height:42px;border-radius:21px;background:var(--sup);border:1px solid var(--linha);display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--sup2);color:var(--tx)}
.ok{background:var(--verde-bg);color:var(--verde-tx)}
.atencao{background:var(--ambar-bg);color:var(--ambar-tx)}
.ruim{background:var(--terra-bg);color:var(--terra-tx)}
#conteudo{display:flex;flex-direction:column;gap:14px;max-width:880px}
.entra{animation:entra .28s ease-out both}
@keyframes entra{from{opacity:.35;transform:translateY(8px)}to{opacity:1;transform:none}}
.blk{background:var(--sup);border:1px solid var(--linha);border-radius:18px;padding:16px}
.blk h2{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--tx3);margin:0 0 8px}
.blk.alerta{border:2px solid var(--ambar)}
.linha{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--linha);width:100%;text-align:left}
.blk h2+.linha,.blk .linha:first-child{border-top:0}
.linha .t{flex:1;min-width:0}
.linha .v{color:var(--tx2);font-size:14px;white-space:nowrap}
.linha.vai .v::after{content:"";display:inline-block;width:7px;height:7px;border-right:2px solid var(--tx3);border-top:2px solid var(--tx3);transform:rotate(45deg);margin-left:8px;vertical-align:1px}
.saud h3{font-family:var(--serif);font-weight:600;font-size:24px;margin:0 0 4px}
.saud p{margin:0;color:var(--tx2)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--sup);border:1px solid var(--linha);border-radius:16px;padding:14px}
.kpi .r{font-size:13px;color:var(--tx2)}
.kpi{display:flex;flex-direction:column;align-items:flex-start;gap:4px}
.kpi .n{font-size:26px;font-weight:600;line-height:1.15}
.kpi .n.c-ok{color:var(--verde)}.kpi .n.c-atencao{color:var(--ambar)}.kpi .n.c-ruim{color:var(--terra)}
.kpi .x{font-size:12px;color:var(--tx3);margin-top:2px}
.ck{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--linha);width:100%;text-align:left}
.ck:first-of-type{border-top:0}
.ck .box{width:24px;height:24px;border-radius:7px;border:2px solid var(--tx3);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ck.feito .box{background:var(--verde);border-color:var(--verde);color:#fff}
.ck.feito .t{color:var(--tx3);text-decoration:line-through}
.prog .barra{height:10px;border-radius:5px;background:var(--sup2);overflow:hidden;margin:10px 0 6px}
.prog .barra i{display:block;height:100%;background:var(--verde);border-radius:5px}
.prog .nums{font-size:22px;font-weight:600}
.prog p{margin:0;color:var(--tx2);font-size:14px}
.aviso{display:flex;gap:10px;align-items:flex-start;border-radius:16px;padding:14px 16px;font-size:15px}
.trava{border:2px dashed var(--linha);border-radius:16px;padding:14px 16px;color:var(--tx3);display:flex;gap:10px;align-items:center;font-size:15px}
.nota{background:var(--nota-bg);border-left:4px solid var(--nota-borda);padding:12px 14px;font-size:14px;color:var(--tx2);display:flex;gap:10px}
.nota b{color:var(--tx);font-weight:600;white-space:nowrap}
body.sem-notas .nota{display:none}
.busca{display:flex;align-items:center;gap:10px;background:var(--sup);border:1px solid var(--linha);border-radius:14px;padding:0 14px;color:var(--tx3)}
.busca input{flex:1;border:0;background:none;font:inherit;color:var(--tx);padding:13px 0;outline:none;min-width:0}
.grade{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.cartao{background:var(--sup2);border-radius:14px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px}
.cartao b{font-weight:600}
.cartao span{font-size:13px;color:var(--tx2)}
.ficha h3{font-family:var(--serif);font-weight:600;font-size:24px;margin:0 0 6px}
.ficha .sec{margin-top:14px}
.ficha ol{margin:6px 0 0;padding-left:20px;color:var(--tx)}
.ficha ol li{padding:4px 0}
.extra{margin-top:14px;border:2px solid var(--verde);border-radius:14px;padding:4px 14px 6px}
.extra h2{color:var(--verde);margin:10px 0 2px}
.cont .linha input{width:76px;padding:9px 10px;border-radius:10px;border:1px solid var(--linha);background:var(--bg);color:var(--tx);font:inherit;text-align:right}
.cont .un{font-size:13px;color:var(--tx3)}
.tab-wrap{overflow-x:auto;margin:0 -4px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-weight:600;color:var(--tx2);padding:8px 6px;border-bottom:2px solid var(--linha);vertical-align:bottom}
@media (max-width:480px){table{font-size:13px}th,td{padding-left:4px;padding-right:4px}}
td{padding:10px 6px;border-bottom:1px solid var(--linha)}
td:first-child{font-weight:500}
.casas{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.casa{background:var(--sup2);border-radius:14px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;gap:6px;align-items:flex-start}
.casa b{font-weight:600}
.barras .item{display:grid;grid-template-columns:72px minmax(0,1fr) 44px;gap:10px;align-items:center;padding:6px 0}
.barras .trilho{height:14px;border-radius:7px;background:var(--sup2);overflow:hidden}
.barras .trilho i{display:block;height:100%;background:var(--verde);border-radius:7px}
.barras .vv{text-align:right;font-weight:600;font-size:14px}
.barra-nav{position:fixed;left:0;right:0;bottom:0;background:var(--sup);border-top:1px solid var(--linha);display:flex;justify-content:space-around;padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
.barra-nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--tx3);padding:4px 8px;min-width:56px}
.barra-nav button.on{color:var(--verde);font-weight:600}
.estado{max-width:520px;margin:15vh auto;text-align:center;padding:0 16px}
.estado h1{font-family:var(--serif);font-weight:600;font-size:28px;margin:0 0 10px}
.estado p{color:var(--tx2)}
.estado a{display:inline-block;margin-top:10px;padding:10px 18px;border-radius:999px;background:var(--verde);color:#fff;text-decoration:none;font-weight:600}
.esq{height:88px;border-radius:18px;background:var(--sup2);animation:pulsa 1.2s ease-in-out infinite}
@keyframes pulsa{50%{opacity:.5}}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center;z-index:9}
.toast.on{opacity:1;transform:translateX(-50%)}
@media (min-width:900px){
  .lado{display:flex;flex-direction:column;gap:4px;width:250px;flex-shrink:0;background:var(--sup);border-right:1px solid var(--linha);padding:24px 14px;position:sticky;top:0;height:calc(100vh - 44px)}
  .lado .marca{font-family:var(--serif);font-weight:600;font-size:22px;padding:0 10px}
  .lado .quem{padding:2px 10px 18px;color:var(--tx2);font-size:14px}
  .lado button{display:flex;align-items:center;gap:12px;padding:10px;border-radius:12px;color:var(--tx2);font-size:15px;text-align:left}
  .lado button.on{background:var(--verde-bg);color:var(--verde-tx);font-weight:600}
  main{padding:8px 40px 48px}
  .topo h1{font-size:36px}
  .barra-nav{display:none}
  .toast{bottom:32px}
}
@media (prefers-reduced-motion:reduce){.entra,.esq{animation:none}}
</style>
</head>
<body>
<div class="faixa">
  <span><b>Prévia da nova versão</b> · só você vê · dados ilustrativos</span>
  <span class="perfis" id="perfis"></span>
  <button class="notas" id="bt-notas" type="button" aria-pressed="true"><span>Notas da prévia</span><span class="chave on" id="chave-notas"></span></button>
</div>
<div class="app" id="app">
  <aside class="lado" id="lado"></aside>
  <main id="main"><div id="conteudo"><div class="esq"></div><div class="esq"></div><div class="esq"></div></div></main>
</div>
<nav class="barra-nav" id="barra-nav" aria-label="Navegação"></nav>
<div class="toast" id="toast" role="status"></div>
<script>
(function () {
  'use strict';
  var PERFIL = 'dono';
  var WORKER = 'https://contagem-bares.rodrigopcviana.workers.dev';
  var ICONES = {"mural": "<rect x=\"4\" y=\"4\" width=\"7\" height=\"7\" rx=\"1.5\"/><rect x=\"13\" y=\"4\" width=\"7\" height=\"7\" rx=\"1.5\"/><rect x=\"4\" y=\"13\" width=\"7\" height=\"7\" rx=\"1.5\"/><rect x=\"13\" y=\"13\" width=\"7\" height=\"7\" rx=\"1.5\"/>", "cocktail": "<path d=\"M4 5h16l-8 9z\"/><path d=\"M12 14v6M8 20h8\"/>", "turno": "<circle cx=\"12\" cy=\"12\" r=\"8\"/><path d=\"M12 8v4l3 2\"/>", "book": "<path d=\"M4 19.5A2.5 2.5 0 0 1 6.5 17H20\"/><path d=\"M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z\"/>", "menu": "<path d=\"M4 7h16M4 12h16M4 17h16\"/>", "balanca": "<path d=\"M12 4v16M8 20h8\"/><path d=\"M3 8h18\"/><path d=\"M6.5 8 3 14h7z\"/><path d=\"M17.5 8 14 14h7z\"/>", "users": "<circle cx=\"9\" cy=\"8\" r=\"3\"/><path d=\"M3.5 20c.4-4.2 2.6-6.2 5.5-6.2s5.1 2 5.5 6.2\"/><circle cx=\"17.2\" cy=\"9\" r=\"2.2\"/><path d=\"M15.6 13.3c2.2.4 3.5 2.1 3.9 5.2\"/>", "lista": "<path d=\"M9 6.5h11M9 12h11M9 17.5h11\"/><circle cx=\"4.8\" cy=\"6.5\" r=\".9\"/><circle cx=\"4.8\" cy=\"12\" r=\".9\"/><circle cx=\"4.8\" cy=\"17.5\" r=\".9\"/>", "chart": "<path d=\"M4 20h16\"/><path d=\"M7 20v-6M12 20V7M17 20v-9\"/>", "lock": "<rect x=\"5\" y=\"11\" width=\"14\" height=\"9\" rx=\"2\"/><path d=\"M8 11V7a4 4 0 0 1 8 0v4\"/>", "lupa": "<circle cx=\"11\" cy=\"11\" r=\"6\"/><path d=\"M20 20l-4.3-4.3\"/>", "sino": "<path d=\"M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6\"/><path d=\"M10 19a2 2 0 0 0 4 0\"/>", "alert": "<path d=\"M12 3.5l9 15.5H3z\"/><path d=\"M12 10v4M12 16.5h.01\"/>", "check-circle": "<circle cx=\"12\" cy=\"12\" r=\"9\"/><path d=\"M8 12.5l2.5 2.5L16 9\"/>"};
  var PERFIS = [['bartender', 'Bartender'], ['chefe-gra', 'Chefe do Grá'], ['dono', 'Você']];
  var arquivo = function (p) { return 'previa-v2-' + p + '.html'; };

  try {
    var tema = localStorage.getItem('portal_tema');
    var escuro = tema ? tema === 'grafite' : (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
    if (escuro) document.documentElement.classList.add('escuro');
  } catch (e) {}

  function ic(nome, px) {
    var p = ICONES[nome]; if (!p) return '';
    px = px || 20;
    return '<svg class="ic" width="' + px + '" height="' + px + '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + p + '</svg>';
  }
  function el(tag, cls, txt) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (txt !== undefined && txt !== null) e.textContent = String(txt);
    return e;
  }
  var toastT = null;
  function toast(msg) {
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('on');
    clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove('on'); }, 2400);
  }

  var perfis = document.getElementById('perfis');
  PERFIS.forEach(function (p) {
    var a = el('a', p[0] === PERFIL ? 'on' : '', p[1]);
    a.href = arquivo(p[0]);
    perfis.appendChild(a);
  });

  var notasOn = true;
  try { notasOn = localStorage.getItem('previa_v2_notas') !== '0'; } catch (e) {}
  function aplicaNotas() {
    document.body.classList.toggle('sem-notas', !notasOn);
    document.getElementById('chave-notas').classList.toggle('on', notasOn);
    document.getElementById('bt-notas').setAttribute('aria-pressed', notasOn ? 'true' : 'false');
  }
  document.getElementById('bt-notas').addEventListener('click', function () {
    notasOn = !notasOn; aplicaNotas();
    try { localStorage.setItem('previa_v2_notas', notasOn ? '1' : '0'); } catch (e) {}
  });
  aplicaNotas();

  function estado(titulo, texto, link) {
    document.getElementById('lado').innerHTML = '';
    document.getElementById('barra-nav').innerHTML = '';
    var main = document.getElementById('main');
    main.innerHTML = '';
    var box = el('div', 'estado');
    box.appendChild(el('h1', '', titulo));
    box.appendChild(el('p', '', texto));
    if (link) { var a = el('a', '', link[1]); a.href = link[0]; box.appendChild(a); }
    main.appendChild(box);
  }

  function sessao() {
    try {
      var s = JSON.parse(localStorage.getItem('portal_sessao') || 'null');
      if (!s || !s.token || !s.exp || Date.now() > s.exp) return null;
      return s;
    } catch (e) { return null; }
  }

  var s = sessao();
  if (!s) { location.replace('index.html?volta=' + encodeURIComponent(arquivo(PERFIL)) + '#nivel'); return; }

  var D = null;

  function vaiPara(id) { location.hash = '#/' + id; }

  function linhaLista(i) {
    var temVai = !!i.vai;
    var b = el(temVai ? 'button' : 'button', 'linha' + (temVai ? ' vai' : ''));
    b.type = 'button';
    b.appendChild(el('span', 't', i.texto));
    if (i.estado && i.valor) b.appendChild(el('span', 'pill ' + i.estado, i.valor));
    else if (i.valor) b.appendChild(el('span', 'v', i.valor));
    else if (temVai) b.appendChild(el('span', 'v', ''));
    b.addEventListener('click', function () {
      if (temVai) vaiPara(i.vai);
      else toast('Na versão final, abre: ' + i.texto);
    });
    return b;
  }

  var PALAVRA = { ok: 'em dia', atencao: 'atenção', ruim: 'urgente' };
  var R = {
    nota: function (b) {
      var d = el('div', 'nota');
      d.appendChild(el('b', '', 'Nota'));
      d.appendChild(el('span', '', b.texto));
      return d;
    },
    saudacao: function (b) {
      var d = el('div', 'blk saud');
      d.appendChild(el('h3', '', b.titulo));
      d.appendChild(el('p', '', b.texto));
      return d;
    },
    kpis: function (b) {
      var d = el('div', 'kpis');
      b.itens.forEach(function (k) {
        var c = el('div', 'kpi');
        c.appendChild(el('div', 'r', k.rotulo));
        c.appendChild(el('div', 'n' + (k.estado ? ' c-' + k.estado : ''), k.valor));
        if (k.estado) c.appendChild(el('span', 'pill ' + k.estado, PALAVRA[k.estado] || k.estado));
        if (k.nota) c.appendChild(el('div', 'x', k.nota));
        d.appendChild(c);
      });
      return d;
    },
    lista: function (b) {
      var d = el('div', 'blk' + (b.destaque === 'alerta' ? ' alerta' : ''));
      if (b.titulo) d.appendChild(el('h2', '', b.titulo));
      b.itens.forEach(function (i) { d.appendChild(linhaLista(i)); });
      return d;
    },
    checklist: function (b) {
      var d = el('div', 'blk' + (b.destaque === 'alerta' ? ' alerta' : ''));
      var feitos = b.itens.filter(function (i) { return i.feito; }).length;
      var h = el('h2', '', b.titulo + ' · ' + feitos + ' de ' + b.itens.length);
      d.appendChild(h);
      b.itens.forEach(function (i) {
        var c = el('button', 'ck' + (i.feito ? ' feito' : ''));
        c.type = 'button';
        var box = el('span', 'box'); box.innerHTML = i.feito ? ic('check-circle', 0) : '';
        c.appendChild(box);
        c.appendChild(el('span', 't', i.texto));
        c.addEventListener('click', function () {
          i.feito = !i.feito;
          c.classList.toggle('feito', i.feito);
          box.innerHTML = i.feito ? '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>' : '';
          var f = b.itens.filter(function (x) { return x.feito; }).length;
          h.textContent = b.titulo + ' · ' + f + ' de ' + b.itens.length;
          toast('Prévia: nada é salvo');
        });
        if (i.feito) box.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>';
        d.appendChild(c);
      });
      return d;
    },
    progresso: function (b) {
      var d = el('div', 'blk prog');
      d.appendChild(el('h2', '', b.titulo));
      d.appendChild(el('div', 'nums', b.atual + ' de ' + b.total));
      var bar = el('div', 'barra'); var i = el('i');
      i.style.width = Math.round(100 * b.atual / b.total) + '%';
      bar.appendChild(i); d.appendChild(bar);
      if (b.texto) d.appendChild(el('p', '', b.texto));
      return d;
    },
    aviso: function (b) {
      var d = el('div', 'aviso ' + (b.estado || 'ok'));
      d.innerHTML = ic(b.estado === 'ok' ? 'sino' : 'alert', 20);
      d.appendChild(el('span', '', b.texto));
      return d;
    },
    trava: function (b) {
      var d = el('div', 'trava');
      d.innerHTML = ic('lock', 20);
      d.appendChild(el('span', '', b.texto));
      return d;
    },
    busca: function (b) {
      var d = el('label', 'busca');
      d.innerHTML = ic('lupa', 20);
      var inp = el('input'); inp.type = 'search'; inp.placeholder = b.texto;
      inp.addEventListener('input', function () {
        var q = inp.value.trim().toLowerCase();
        document.querySelectorAll('#conteudo .linha').forEach(function (l) {
          l.style.display = !q || l.textContent.toLowerCase().indexOf(q) >= 0 ? 'flex' : 'none';
        });
      });
      d.appendChild(inp);
      return d;
    },
    grade: function (b) {
      var d = el('div', 'blk');
      if (b.titulo) d.appendChild(el('h2', '', b.titulo));
      var g = el('div', 'grade');
      b.itens.forEach(function (i) {
        var c = el('button', 'cartao'); c.type = 'button';
        c.appendChild(el('b', '', i.titulo));
        if (i.texto) c.appendChild(el('span', '', i.texto));
        c.addEventListener('click', function () { if (i.vai) vaiPara(i.vai); else toast('Na versão final, abre: ' + i.titulo); });
        g.appendChild(c);
      });
      d.appendChild(g);
      return d;
    },
    ficha: function (b) {
      var d = el('div', 'blk ficha');
      d.appendChild(el('h3', '', b.nome));
      (b.campos || []).forEach(function (c) {
        var l = el('div', 'linha'); l.appendChild(el('span', 't', c[0])); l.appendChild(el('span', 'v', c[1])); d.appendChild(l);
      });
      var s1 = el('div', 'sec'); s1.appendChild(el('h2', '', 'Ingredientes'));
      (b.ingredientes || []).forEach(function (c) {
        var l = el('div', 'linha'); l.appendChild(el('span', 't', c[0])); l.appendChild(el('span', 'v', c[1])); s1.appendChild(l);
      });
      d.appendChild(s1);
      var s2 = el('div', 'sec'); s2.appendChild(el('h2', '', 'Preparo'));
      var ol = el('ol'); (b.preparo || []).forEach(function (p) { ol.appendChild(el('li', '', p)); });
      s2.appendChild(ol); d.appendChild(s2);
      if (b.extra) {
        var x = el('div', 'extra'); x.appendChild(el('h2', '', b.extra.titulo));
        b.extra.itens.forEach(function (c) {
          var l = el('div', 'linha'); l.appendChild(el('span', 't', c[0])); l.appendChild(el('span', 'v', c[1])); x.appendChild(l);
        });
        d.appendChild(x);
      }
      return d;
    },
    contagem: function (b) {
      var d = el('div', 'blk cont');
      d.appendChild(el('h2', '', b.titulo));
      b.itens.forEach(function (i) {
        var l = el('label', 'linha');
        var t = el('span', 't'); t.appendChild(el('div', '', i.nome)); t.appendChild(el('div', 'un', i.unidade));
        l.appendChild(t);
        var inp = el('input'); inp.type = 'text'; inp.inputMode = 'decimal'; inp.value = i.valor || ''; inp.placeholder = '—';
        inp.setAttribute('aria-label', i.nome);
        inp.addEventListener('change', function () { toast('Prévia: guardado só nesta tela'); });
        l.appendChild(inp);
        d.appendChild(l);
      });
      return d;
    },
    tabela: function (b) {
      var d = el('div', 'blk');
      if (b.titulo) d.appendChild(el('h2', '', b.titulo));
      var w = el('div', 'tab-wrap'); var t = el('table');
      var tr = el('tr'); b.colunas.forEach(function (c) { tr.appendChild(el('th', '', c)); }); t.appendChild(tr);
      b.linhas.forEach(function (ln) { var r = el('tr'); ln.forEach(function (c) { r.appendChild(el('td', '', c)); }); t.appendChild(r); });
      w.appendChild(t); d.appendChild(w);
      return d;
    },
    casas: function (b) {
      var d = el('div', 'blk');
      if (b.titulo) d.appendChild(el('h2', '', b.titulo));
      var g = el('div', 'casas');
      b.itens.forEach(function (c) {
        var x = el('button', 'casa'); x.type = 'button';
        x.appendChild(el('b', '', c.nome));
        x.appendChild(el('span', 'pill ' + (c.estado || ''), c.rotulo));
        x.addEventListener('click', function () { if (c.vai) vaiPara(c.vai); else toast('Na versão final, abre a casa ' + c.nome); });
        g.appendChild(x);
      });
      d.appendChild(g);
      return d;
    },
    barras: function (b) {
      var d = el('div', 'blk barras');
      if (b.titulo) d.appendChild(el('h2', '', b.titulo));
      var max = Math.max.apply(null, b.itens.map(function (i) { return i.valor; })) || 1;
      b.itens.forEach(function (i) {
        var it = el('div', 'item');
        it.appendChild(el('span', '', i.rotulo));
        var tr = el('div', 'trilho'); var f = el('i'); f.style.width = Math.round(100 * i.valor / max) + '%'; tr.appendChild(f);
        it.appendChild(tr);
        it.appendChild(el('span', 'vv', i.valor + (b.sufixo || '')));
        d.appendChild(it);
      });
      return d;
    }
  };

  function navs(atual) {
    var lado = document.getElementById('lado');
    var barra = document.getElementById('barra-nav');
    lado.innerHTML = ''; barra.innerHTML = '';
    lado.appendChild(el('div', 'marca', 'Bares IZ'));
    lado.appendChild(el('div', 'quem', D.rotulo + ' · ' + D.casa));
    var raiz = atual;
    var t = D.telas[atual];
    while (t && t.voltar) { raiz = t.voltar; t = D.telas[raiz]; }
    if (!D.nav.some(function (n) { return n.id === raiz; })) raiz = D.inicio;
    D.nav.forEach(function (n) {
      [lado, barra].forEach(function (onde) {
        var b = el('button', n.id === raiz ? 'on' : ''); b.type = 'button';
        b.innerHTML = ic(n.icone, onde === barra ? 22 : 20);
        b.appendChild(el('span', '', n.rotulo));
        b.addEventListener('click', function () { vaiPara(n.id); });
        onde.appendChild(b);
      });
    });
  }

  function desenha() {
    var id = (location.hash || '').replace(/^#\/?/, '');
    if (!D.telas[id]) id = D.inicio;
    var tela = D.telas[id];
    navs(id);
    var main = document.getElementById('main');
    main.innerHTML = '';
    var topo = el('div', 'topo');
    var tit = el('div', 'tit');
    if (tela.voltar) {
      var v = el('button', 'voltar'); v.type = 'button';
      v.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>';
      v.appendChild(el('span', '', D.telas[tela.voltar].titulo));
      v.addEventListener('click', function () { vaiPara(tela.voltar); });
      tit.appendChild(v);
    }
    tit.appendChild(el('h1', '', tela.titulo));
    if (tela.sub) tit.appendChild(el('div', 'sub', tela.sub));
    topo.appendChild(tit);
    var perg = el('button', 'btn-ic'); perg.type = 'button'; perg.setAttribute('aria-label', 'Pergunte');
    perg.innerHTML = ic('lupa', 20);
    perg.addEventListener('click', function () { toast('Na versão final, abre o Pergunte (chat do assistente)'); });
    topo.appendChild(perg);
    main.appendChild(topo);
    var cont = el('div', 'entra'); cont.id = 'conteudo';
    tela.blocos.forEach(function (b) {
      var f = R[b.tipo];
      if (f) cont.appendChild(f(b));
    });
    main.appendChild(cont);
    document.title = tela.titulo + ' · Prévia da nova versão';
    window.scrollTo(0, 0);
  }

  fetch(WORKER + '/api/previa-v2?perfil=' + encodeURIComponent(PERFIL), {
    headers: { 'X-Token': s.token }, cache: 'no-store'
  }).then(function (r) {
    if (r.status === 403) { estado('Prévia restrita', 'Esta página só abre com a senha do Rodrigo. O seu acesso atual não vê esta prévia.', ['index.html#nivel', 'Trocar acesso']); return null; }
    if (r.status === 429) { estado('Muitas tentativas', 'Espere um minuto e abra de novo.'); return null; }
    if (!r.ok) { estado('Não deu para abrir', 'O servidor respondeu com erro ' + r.status + '. Tente de novo em instantes.'); return null; }
    return r.json();
  }).then(function (d) {
    if (!d) return;
    D = d;
    window.addEventListener('hashchange', desenha);
    desenha();
  }).catch(function () {
    estado('Sem conexão', 'Não foi possível falar com o servidor. Confira a internet e abra de novo.');
  });
})();
</script>
</body>
</html>
