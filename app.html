<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#FFFFFF" id="cor-tema">
<title>Bares IZ</title>
<!-- App piloto do Grupo IZ (PLANO_APP_PILOTO_IZ.md). Fonte: app_piloto/app.html no
     grupo-iz-portal-source. Casca sem dado: tudo vem de /api/app-iz sob token. -->
<script>
try { if (window.top !== window.self && window.top.location.origin === location.origin) window.top.location.replace(location.href); } catch (e) {}
try { var t = localStorage.getItem('app_iz_tema'); if (t === 'escuro' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('escuro'); } catch (e) {}
try { if (document.documentElement.classList.contains('escuro')) document.querySelector('meta[name=theme-color]').content = '#16140F'; } catch (e) {}
</script>
<link rel="manifest" href="app.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bares IZ">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500..700&family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#FFFFFF;--sup:#F5F5F3;--sup2:#ECECE9;--linha:#E2E2DE;--tx:#111111;--tx2:#3D3D3A;--tx3:#6B6B66;--verde:#111111;--verde-bg:#ECECE9;--verde-tx:#111111;--on-verde:#FFFFFF;--terra:#B5482F;--terra-bg:#F3DCD2;--terra-tx:#7E2F1C;--ambar:#B7791F;--ambar-bg:#F6E7C8;--ambar-tx:#6B4A0E;--minha:#111111;--minha-tx:#fff;--serif:'Fraunces',Georgia,serif;--sans:'Inter',system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
:root.escuro{--bg:#16140F;--sup:#211E18;--sup2:#2A2620;--linha:#3A342A;--tx:#EFE8DA;--tx2:#CFC6B4;--tx3:#A39A88;--verde:#C9A15A;--verde-bg:#3A3020;--verde-tx:#E6C88E;--on-verde:#16140F;--terra:#EE9C86;--terra-bg:#45261D;--terra-tx:#F6C1B2;--ambar:#E0B062;--ambar-bg:#3D3020;--ambar-tx:#F1D49B;--minha:#C9A15A;--minha-tx:#16140F}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:inherit}
svg{flex-shrink:0}
.app{display:flex;min-height:100vh}
.lado{display:none}
main{flex:1;min-width:0;padding:0 16px 110px;max-width:100%}
/* topo (27/11): linha fixa com casa e ícones; a saudação grande abre o chat e rola junto */
.topo{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 16px 8px;margin:0 -16px}
.topo-l1{display:flex;align-items:center;gap:8px;height:42px}
.topo-l1 .quem-l{flex:1;min-width:0;display:flex;align-items:center;gap:6px;flex-wrap:nowrap;overflow:hidden}
.ola{font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.12;letter-spacing:-.01em;margin:6px 0 0}
.ola small{display:block;font-family:var(--sans);font-size:13.5px;font-weight:500;letter-spacing:0;color:var(--tx3);margin-top:3px}
.topo .ics{display:flex;gap:6px;flex-shrink:0}
.casa-chip{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:var(--verde-tx);background:var(--verde-bg);border-radius:999px;padding:6px 12px;max-width:100%;white-space:nowrap}
.casa-chip::before{content:'';width:7px;height:7px;border-radius:4px;background:var(--verde);flex-shrink:0}
.casa-chip select{appearance:none;-webkit-appearance:none;border:0;background:none;font:inherit;color:inherit;padding:0 14px 0 0;cursor:pointer;background-image:linear-gradient(45deg,transparent 50%,currentColor 50%),linear-gradient(135deg,currentColor 50%,transparent 50%);background-position:calc(100% - 6px) 55%,calc(100% - 2px) 55%;background-size:4px 4px;background-repeat:no-repeat}
.btn-ic{width:40px;height:40px;border-radius:20px;background:var(--sup);border:1px solid var(--linha);display:flex;align-items:center;justify-content:center;color:var(--tx);text-decoration:none;transition:background .15s}
.btn-ic:active{background:var(--sup2)}
#conteudo{display:flex;flex-direction:column;gap:14px;max-width:820px;margin:0 auto;padding-top:6px}
.cab h1{font-family:var(--serif);font-weight:600;font-size:28px;line-height:1.1;margin:6px 0 2px}
.cab p{margin:0;color:var(--tx2);font-size:14px}
.blk{background:var(--sup);border:1px solid var(--linha);border-radius:18px;padding:16px}
.blk h2{font-size:13px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--tx3);margin:0 0 8px}
.linha{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-top:1px solid var(--linha);width:100%;text-align:left;text-decoration:none}
.blk h2+.linha,.blk .linha:first-child{border-top:0}
.linha .t{flex:1;min-width:0}
.linha .t small{display:block;color:var(--tx3);font-size:13px}
.linha .v{color:var(--tx2);font-size:14px;white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px;background:var(--sup2);color:var(--tx)}
.ok{background:var(--verde-bg);color:var(--verde-tx)}.atencao{background:var(--ambar-bg);color:var(--ambar-tx)}.ruim{background:var(--terra-bg);color:var(--terra-tx)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex-shrink:0;text-decoration:none;font-size:13px;font-weight:600;padding:6px 12px;border-radius:999px;border:1px solid var(--linha);background:var(--sup);color:var(--tx2)}
.chip[aria-pressed=true]{background:var(--tx);color:var(--bg);border-color:var(--tx)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;background:var(--verde);color:var(--on-verde);text-decoration:none;font-weight:600;font-size:14px}
.btn.sec{background:var(--sup2);color:var(--tx)}
.vazio{color:var(--tx3);text-align:center;padding:24px 8px}
.esq{height:72px;border-radius:18px;background:var(--sup2);animation:pulsa 1.2s ease-in-out infinite}
@keyframes pulsa{50%{opacity:.5}}
/* chat */
.chat-lista{display:flex;flex-direction:column;gap:10px;padding-bottom:8px}
.bolha{max-width:88%;border-radius:18px;padding:11px 14px;background:var(--sup);border:1px solid var(--linha);align-self:flex-start;font-size:15px;overflow-wrap:anywhere}
.bolha.minha{align-self:flex-end;background:var(--minha);color:var(--minha-tx);border-color:transparent;border-bottom-right-radius:6px}
.bolha.dele{border-bottom-left-radius:6px}
.bolha.t-bomdia{max-width:100%;width:100%;border-radius:18px}
.bolha.guardada{opacity:.75;border:1px dashed var(--linha)}
.bolha.erro{background:var(--terra-bg);color:var(--terra-tx);border-color:transparent}
.bl-pe{display:flex;align-items:center;justify-content:flex-end;gap:8px;font-size:11.5px;opacity:.7;margin-top:6px}
.bl-tag{display:inline-block;font-size:11.5px;font-weight:600;opacity:.85;margin-bottom:4px}
.bl-sec{margin-top:10px;padding-top:10px;border-top:1px solid var(--linha)}
.bl-sec b{display:block;font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--tx3);margin-bottom:4px}
.bl-sec ul{margin:0;padding-left:18px}
.bl-sec li{padding:2px 0}
.bl-sec li small{color:var(--tx3)}
.bl-links{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.bl-retorno{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;padding-top:9px;border-top:1px solid var(--linha)}
.bl-retorno button{font-size:12.5px;font-weight:600;padding:5px 10px;border-radius:999px;border:1px solid var(--linha);color:var(--tx2);background:none}
.bl-retorno button:disabled{opacity:.6}
.cer-chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:6px;margin-top:10px}
.cer-chips span{background:var(--sup2);border-radius:12px;padding:7px 10px;font-weight:600;font-size:14px;min-width:0}
.cer-chips small{display:block;font-weight:400;font-size:11.5px;color:var(--tx3)}
.cer-itens{list-style:none;margin:10px 0 0;padding:0}
.cer-itens li{padding:6px 0;border-top:1px solid var(--linha);font-size:14px}
.cer-itens li:first-child{border-top:0}
.cer-itens small{display:block;color:var(--tx3);font-size:12.5px}
.cer-fontes{margin-top:8px;font-size:12px;color:var(--tx3)}
.cer-fontes a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.bolha.t-coord{background:var(--verde-bg);color:var(--verde-tx);border-color:transparent}
.nota-sis{align-self:center;font-size:12.5px;color:var(--tx3);text-align:center;padding:2px 12px;max-width:90%}
.selo{display:inline-flex;align-items:center;justify-content:center;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--terra);color:#fff;font-size:11px;font-weight:700;margin-left:6px;vertical-align:middle}
.cn-per{margin:0 0 10px}
.uz-conta{margin-top:12px;display:flex;flex-direction:column;gap:8px}
.uz-cab{display:flex;justify-content:space-between;gap:10px;width:100%;text-align:left;background:none;border:0;padding:0;color:inherit;font:inherit;cursor:pointer}
.uz-cab .t{min-width:0}
.uz-cab small{display:block;color:var(--tx3);font-size:12.5px;font-weight:400}
.uz-cab .v{text-align:right;white-space:nowrap;font-size:14px}
.uz-num{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px;color:var(--tx2)}
.uz-tira{display:grid;grid-template-columns:repeat(14,1fr);gap:3px}
.uz-tira i{display:block;height:14px;border-radius:3px;background:var(--sup2)}
.uz-tira i.n1{background:var(--verde);opacity:.3}
.uz-tira i.n2{background:var(--verde);opacity:.55}
.uz-tira i.n3{background:var(--verde);opacity:.8}
.uz-tira i.n4{background:var(--verde)}
.cn-nota{font-size:12.5px;color:var(--tx3);margin:8px 0 4px}
#cn{margin-bottom:12px}
.cq{display:flex;flex-direction:column;gap:9px;margin-bottom:12px}
.cq-quem{font-size:13.5px;color:var(--tx2)}
.cq-quem small{display:block;color:var(--tx3);font-size:12px}
.cq-p{margin:0;font-size:16px;font-weight:600}
.cq-ia{font-size:13.5px;color:var(--tx2)}
.cq-ia summary{cursor:pointer;color:var(--tx3)}
.cq textarea{width:100%;border:1px solid var(--linha);border-radius:12px;background:var(--bg);color:var(--tx);font:inherit;padding:10px;resize:vertical}
.cq-ens{font-size:13.5px;display:flex;gap:8px;align-items:center}
.cq-bts{display:flex;gap:8px}
.bl-links a,.bl-links button{font-size:13px;font-weight:600;padding:6px 11px;border-radius:999px;background:var(--sup2);color:var(--tx);text-decoration:none}
.meta-barra{height:8px;border-radius:4px;background:var(--sup2);overflow:hidden;margin:6px 0 4px}
.meta-barra i{display:block;height:100%;background:var(--verde);border-radius:4px}
.bt-ouvir{width:26px;height:26px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;color:inherit;opacity:.8}
.bt-ouvir.on{background:var(--verde-bg);color:var(--verde-tx);opacity:1}
.pensando .pontos{display:inline-flex;gap:4px}
.pensando .pontos i{width:7px;height:7px;border-radius:4px;background:var(--tx3);animation:pulsa 1s infinite}
.pensando .pontos i:nth-child(2){animation-delay:.2s}.pensando .pontos i:nth-child(3){animation-delay:.4s}
.chat-campo{position:fixed;left:0;right:0;bottom:calc(88px + env(safe-area-inset-bottom));z-index:8;padding:8px 12px 4px;background:linear-gradient(to top,var(--bg) 70%,transparent)}
.chat-linha{display:flex;align-items:flex-end;gap:6px;max-width:820px;margin:0 auto;background:var(--sup);border:1px solid var(--linha);border-radius:24px;padding:5px}
.chat-linha textarea{flex:1;min-width:0;border:0;background:none;resize:none;font:inherit;color:var(--tx);padding:9px 4px;outline:none;max-height:140px}
.cc-bt{width:38px;height:38px;border-radius:19px;display:flex;align-items:center;justify-content:center;color:var(--tx2)}
.cc-env{background:var(--verde);color:var(--on-verde)}
.cc-bt.gravando{background:var(--terra);color:#fff;animation:pulsa 1s infinite}
.cc-menu{max-width:820px;margin:0 auto 8px;background:var(--sup);border:1px solid var(--linha);border-radius:18px;padding:6px;display:flex;flex-direction:column}
.cc-menu a{display:flex;gap:12px;align-items:center;padding:10px;border-radius:12px;text-decoration:none}
.cc-menu a:hover{background:var(--sup2)}
.cc-menu small{display:block;color:var(--tx3);font-size:12.5px}
.chat-espaco{height:112px}
/* atalhos do bom dia (27/11) */
.atalhos{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.atalhos a,.atalhos button{display:inline-flex;align-items:center;gap:6px;padding:5px 12px 5px 5px;border-radius:999px;background:var(--bg);border:1px solid var(--linha);text-decoration:none;font:inherit;font-size:13px;font-weight:600;line-height:1.2;color:var(--tx);cursor:pointer;transition:background .15s,transform .1s}
.atalhos a:active,.atalhos button:active{transform:scale(.97);background:var(--sup2)}
.atalhos .ati{width:26px;height:26px;border-radius:999px;display:flex;align-items:center;justify-content:center;flex:none;background:var(--verde-bg);color:var(--verde-tx)}
.atalhos .ati.al{background:var(--terra-bg);color:var(--terra-tx)}
.atalhos .ati.am{background:var(--ambar-bg);color:var(--ambar-tx)}
.bolha.t-bomdia .bl-tx{font-size:15.5px}
/* fichas (27/11): grade com foto e ficha dentro do app */
.f-grade{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:600px){.f-grade{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (min-width:1100px){.f-grade{grid-template-columns:repeat(4,minmax(0,1fr))}}
.f-card{display:flex;flex-direction:column;text-decoration:none;border-radius:18px;overflow:hidden;background:var(--sup);border:1px solid var(--linha);transition:transform .1s}
.f-card:active{transform:scale(.98)}
.f-foto{position:relative;aspect-ratio:1/1;background:var(--sup2);overflow:hidden}
.f-foto img{width:100%;height:100%;object-fit:cover;display:block}
.f-sem{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;color:var(--tx3);background:radial-gradient(circle at 30% 20%,var(--sup) 0,var(--sup2) 70%)}
.f-sem b{font-family:var(--serif);font-weight:600;font-size:30px;color:var(--tx2);letter-spacing:.02em}
.f-sem small{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase}
.f-txt{padding:10px 12px 12px}
.f-txt b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600;font-size:14.5px;line-height:1.25}
.f-txt small{display:block;margin-top:3px;color:var(--tx3);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.f-cont{font-size:13px;color:var(--tx3);margin:-4px 2px 0}
.fd-volta{display:inline-flex;align-items:center;gap:4px;font-size:14px;font-weight:600;color:var(--tx2);text-decoration:none;padding:4px 0}
.fd-hero{position:relative;border-radius:22px;overflow:hidden;background:var(--sup2);aspect-ratio:4/3;max-height:420px}
.fd-hero img{width:100%;height:100%;object-fit:cover;display:block}
.fd-hero .f-sem b{font-size:46px}
.fd-hero:has(.f-sem){aspect-ratio:16/8}
.fd-nome{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.1;margin:16px 0 8px;letter-spacing:-.01em}
.fd-tags{display:flex;flex-wrap:wrap;gap:6px}
.fd-info{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.fd-info div{background:var(--sup);border:1px solid var(--linha);border-radius:14px;padding:10px 12px}
.fd-info small{display:block;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--tx3);margin-bottom:2px}
.fd-info span{font-weight:600;font-size:14.5px}
.fd-ing{list-style:none;margin:0;padding:0}
.fd-ing li{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;align-items:baseline;padding:10px 0;border-top:1px solid var(--linha);font-size:15px}
.fd-ing li:first-child{border-top:0}
.fd-ing .q{font-weight:700;font-variant-numeric:tabular-nums;color:var(--verde-tx);text-align:right}
.fd-sabor{display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--tx3)}
.fd-sabor .br{flex:1;height:8px;border-radius:4px;background:linear-gradient(90deg,var(--ambar-bg),var(--terra-bg));position:relative}
.fd-sabor .br i{position:absolute;top:50%;width:16px;height:16px;border-radius:8px;background:var(--tx);border:3px solid var(--bg);transform:translate(-50%,-50%)}
/* compartilhar (27/11) */
.folha-fundo{position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;justify-content:center}
.folha{width:100%;max-width:480px;background:var(--bg);border-radius:24px 24px 0 0;padding:10px 20px calc(22px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:12px;animation:sobeF .22s ease-out}
@media (min-width:600px){.folha-fundo{align-items:center}.folha{border-radius:24px}}
@keyframes sobeF{from{transform:translateY(40px);opacity:.4}}
.folha .pega{width:40px;height:5px;border-radius:3px;background:var(--linha)}
.folha h3{font-family:var(--serif);font-weight:600;font-size:22px;margin:4px 0 0}
.folha p{margin:0;color:var(--tx3);font-size:14px;text-align:center}
.qr{display:flex;flex-direction:column;align-items:center;gap:8px}
.qr .q{width:220px;height:220px;padding:14px;background:#fff;border-radius:18px;border:1px solid var(--linha)}
.qr .q svg{width:100%;height:100%;display:block}
.qr .q svg path,.qr .q svg rect[fill="#000000"]{fill:#111}
.qr small{color:var(--tx3);font-size:12.5px}
.folha .url{width:100%;font-size:13px;background:var(--sup);border:1px solid var(--linha);border-radius:12px;padding:10px 12px;color:var(--tx2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center}
.folha .bts{display:flex;gap:8px;width:100%}
.folha .bts .btn{flex:1;justify-content:center;padding:12px 14px;border-radius:14px}
/* mais (27/11): perfil e grade de atalhos */
.perfil{display:flex;align-items:center;gap:14px}
.perfil .av{width:52px;height:52px;border-radius:26px;background:var(--verde);color:var(--on-verde);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:600;font-size:22px;flex-shrink:0}
.perfil b{display:block;font-size:17px}
.perfil small{color:var(--tx3);font-size:13px}
.grade-at{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
@media (min-width:600px){.grade-at{grid-template-columns:repeat(4,minmax(0,1fr))}}
.grade-at a,.grade-at button{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:13px 12px;border-radius:16px;background:var(--bg);border:1px solid var(--linha);text-decoration:none;font-size:13px;font-weight:600;line-height:1.25;text-align:left;position:relative;color:var(--tx)}
.grade-at a:active,.grade-at button:active{background:var(--sup2)}
.grade-at .ati{width:34px;height:34px;border-radius:11px;display:flex;align-items:center;justify-content:center;background:var(--verde-bg);color:var(--verde-tx)}
.grade-at .selo{position:absolute;top:10px;right:10px}
/* performance */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--sup);border:1px solid var(--linha);border-radius:16px;padding:14px}
.kpi .r{font-size:13px;color:var(--tx2)}
.kpi .n{font-size:26px;font-weight:600;line-height:1.15}
.kpi .x{font-size:12px;color:var(--tx3)}
.rk{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--linha)}
.rk:first-of-type{border-top:0}
.rk .pos{font-weight:600;color:var(--tx3);text-align:right}
.rk .nm{min-width:0}
.rk .nm b{font-weight:600;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

  // Pedido genérico. `caminho` começando com http vai como está; o resto é do app.
  function api(caminho, opts) {
    opts = opts || {};
    var url = caminho.indexOf('http') === 0 ? caminho : WORKER + '/api/app-iz' + caminho;
    if (caminho.indexOf('http') !== 0) {
      var casa = PERFIL && !PERFIL.casa_fixa ? casaAtual() : '';
      if (casa) url += (url.indexOf('?') < 0 ? '?' : '&') + 'casa=' + encodeURIComponent(casa);
    }
    var metodo = opts.method || 'GET';
    var guarda = metodo === 'GET' && !opts.semCopia;
    // O sinal de uso (sinalUso) é POST mas não muda dado de tela: não conta como escrita.
    if (metodo !== 'GET' && !opts.semEscrita) { FRESCO = {}; escritaEm = Date.now(); }
    if (guarda && FRESCO[url] && Date.now() - FRESCO[url].em < 15000) return Promise.resolve(JSON.parse(FRESCO[url].s));
    var h = { 'X-Token': S.token };
    if (opts.json !== undefined) h['Content-Type'] = 'application/json';
    var rede = fetch(url, { method: metodo, headers: h, body: opts.json !== undefined ? JSON.stringify(opts.json) : opts.body, cache: 'no-store', keepalive: !!opts.keepalive })
      .then(function (r) {
        return r.json().catch(function () { return {}; }).then(function (d) {
          if (r.status === 401) { var e1 = new Error('Este acesso não abre o app piloto. Use o portal de sempre ou entre com outra senha.'); e1.status = 401; throw e1; }
          if (!r.ok && !(d && d.mensagens)) { var e = new Error(d.erro || 'Erro ' + r.status); e.status = r.status; throw e; }
          if (guarda) {
            guardaCopia(url, d);
            try { FRESCO[url] = { em: Date.now(), s: JSON.stringify(d) }; } catch (e2) {}
            if (offEm) { offEm = null; pintaOff(); }
          }
          d.__status = r.status;
          return d;
        });
      });
    var c = guarda ? leCopia(url) : null;
    // Falha de rede (sem status) cai na cópia; erro do servidor segue como erro.
    var semRede = function (er) {
      if (er && er.status !== undefined) throw er;
      if (c) { offEm = c.em; pintaOff(); return c.d; }
      var e = new Error('Sem internet agora.'); e.status = 0; throw e;
    };
    if (!c) return rede.catch(semRede);
    // Troca de tela rápida (26/11/2026, mesma ideia do portal de Medellín):
    // com cópia no aparelho, a rede tem LENTO_MS (5 s logo depois de gravar
    // algo); passou disso, a tela abre com a cópia e se redesenha quando o
    // dado novo chega diferente. Sem chamada a mais ao Worker.
    var tela = document.body.dataset.tela, espera = Date.now() - escritaEm < 15000 ? 5000 : LENTO_MS;
    return new Promise(function (pronto, falha) {
      var feito = false;
      var t = setTimeout(function () {
        if (feito) return;
        feito = true;
        pronto(c.d);
        rede.then(function (d) {
          var mudou = false;
          try { mudou = JSON.stringify(d) !== JSON.stringify(c.d); } catch (e3) {}
          if (mudou) redesenhaSeguro(tela);
        }, function (er) { if (!er || er.status === undefined) { offEm = c.em; pintaOff(); } });
      }, espera);
      rede.then(function (d) {
        if (feito) return;
        feito = true; clearTimeout(t); pronto(d);
      }, function (er) {
        if (feito) return;
        feito = true; clearTimeout(t);
        try { pronto(semRede(er)); } catch (x) { falha(x); }
      });
    });
  }
  var LENTO_MS = 700, FRESCO = {}, escritaEm = 0;
  // Nada some debaixo do dedo: com janela aberta, campo em foco, texto ainda
  // não enviado ou o Turno aberto (formulário numa moldura), o app não
  // redesenha nem recarrega.
  function momentoSeguro() {
    if (document.body.dataset.tela === 'turno') return false;
    if (document.querySelector('dialog[open], .folha-fundo')) return false;
    var a = document.activeElement;
    if (a && a.matches && a.matches('input, textarea, select, [contenteditable="true"]')) return false;
    return !Array.prototype.some.call(document.querySelectorAll('#main input, #main textarea, #main select'), function (el) {
      if (el.type === 'checkbox' || el.type === 'radio') return el.checked !== el.defaultChecked;
      if (el.tagName === 'SELECT') return Array.prototype.some.call(el.options, function (o) { return o.selected !== o.defaultSelected; });
      if (el.type === 'file') return !!el.value;
      return el.value !== el.defaultValue;
    });

  // ---------------------------------------------------------------- fila de envios

  function filaLe() { try { return JSON.parse(ls(FILA) || '[]'); } catch (e) { return []; } }

  function drena() {
    if (drenando || !navigator.onLine || !PERFIL) return;
    var l = filaLe();
    if (!l.length) return;
    drenando = true;
    var item = l[0];
    var envio = item.tipo === 'aviso' ? enviaAviso(item.corpo, item.casa) : comCasa(item.casa, function () { return api('/chat/pergunta', { method: 'POST', json: item.corpo }); });
    envio.then(function () { tira(true); }, function (e) {
      if (e.status === 0) { drenando = false; return; }
      if (e.status >= 400 && e.status < 500) { aviso('Um envio guardado foi recusado: ' + e.message); tira(false); return; }
      var l2 = filaLe();
      if (l2[0]) { l2[0].tent = (l2[0].tent || 0) + 1; if (l2[0].tent >= 5) { l2.shift(); aviso('Um envio guardado não saiu depois de 5 tentativas.'); } filaGrava(l2); }
      drenando = false;
    });

  var versaoPronta = null, conferindo = false, ultimaAcao = Date.now(), mexeu = false;
  ['pointerdown', 'keydown', 'scroll', 'input'].forEach(function (ev) {
    document.addEventListener(ev, function () { ultimaAcao = Date.now(); mexeu = true; }, { capture: true, passive: true });
  });
  function ssLe(k) { try { return JSON.parse(sessionStorage.getItem(k) || 'null'); } catch (e) { return null; } }
  function confereVersao() {
    if (versaoPronta || conferindo || navigator.onLine === false) return;
    conferindo = true;
    api('', { semCopia: true }).then(function (p) {
      if (!p.versao || p.versao === VERSAO) return;
      var t = ssLe(NV_TENT);
      if (t && t.v === p.versao && Date.now() - t.em < 10 * 60000) return;
      return fetch(APP_URL, { cache: 'no-store', credentials: 'same-origin' }).then(function (r) { return r.ok ? r.text() : null; }).then(function (html) {
        if (!html || html.indexOf("var VERSAO = '" + p.versao + "'") < 0) return;
        var poe = window.caches ? caches.open(APP_CACHE).then(function (c) {
          return c.put(APP_URL, new Response(html, { headers: { 'Content-Type': 'text/html; charset=utf-8' } }));
        }) : Promise.resolve();
        return poe.then(function () { versaoPronta = p.versao; tentaAtualizar(); }, function () { versaoPronta = p.versao; });
      });
    }).catch(function () {}).then(function () { conferindo = false; });
  }
  function tentaAtualizar(forca) {
    if (!versaoPronta || !momentoSeguro()) return false;
    // Recém-aberto e sem toque ainda: entra na hora. Mexendo: espera 1 min parado.
    if (!forca && mexeu && document.visibilityState === 'visible' && Date.now() - ultimaAcao < 60000) return false;
    try { sessionStorage.setItem(NV_TENT, JSON.stringify({ v: versaoPronta, em: Date.now(), y: window.scrollY })); } catch (e) {}
    location.reload();
    return true;
  }
  setInterval(function () { tentaAtualizar(); }, 15000);
  document.addEventListener('visibilitychange', function () { tentaAtualizar(true); });
  (function () {
    var t = ssLe(NV_TENT);
    if (!t || t.v !== VERSAO) return;
    try { sessionStorage.removeItem(NV_TENT); } catch (e) {}
    setTimeout(function () { if (t.y) window.scrollTo(0, t.y); aviso('App atualizado.'); }, 600);
  })();

  // Turno dentro do app: a página do portal numa moldura, sem o topo, a
  // gaveta e a barra de baixo dela (mesma origem, então o app esconde).
  function telaTurno() {
    moldura('turno', '<iframe class="turno-fr" id="turno-fr" title="Turno" src="turno.html?solo=1"></iframe>');
    var fr = document.getElementById('turno-fr');
    function altura() {
      if (!document.body.contains(fr)) { window.removeEventListener('resize', altura); return; }
      var nav = document.getElementById('barra-nav');
      var baixo = nav && nav.offsetHeight ? nav.offsetHeight : 0;
      fr.style.height = Math.max(320, window.innerHeight - fr.getBoundingClientRect().top - baixo - 12) + 'px';
    }
    altura();
    window.addEventListener('resize', altura);
    fr.addEventListener('load', function () {
      try {
        var d = fr.contentDocument, st = d.createElement('style');
        st.textContent = '.volta-mural,header.topo,.gv-fundo,#gaveta,.bx-wrap,#sino-pop,#ia-aba,#ia-painel,#prompt-caixa,p.nota,#atualiza-atalho,#ver-nova{display:none!important}' +
          'body{padding-top:4px!important;padding-bottom:24px!important}';
        d.head.appendChild(st);
      } catch (e) {}
      temaTurno(fr);
      altura();
    });
  }

  // O Turno segue o modo do app (26/11/2026): liga ou desliga o modo escuro
  // do portal só dentro da moldura, sem mexer no portal_tema (que é do
  // portal), e troca as cores do portal pelas do app.
  var TURNO_CORES = {
    claro: '--bg:#FFFFFF;--card:#F5F5F3;--card-2:#ECECE9;--border:#E2E2DE;--border-2:#D0D0CB;--text:#111111;--text-2:#3D3D3A;--text-3:#6B6B66;--text-4:#9A9A94;--acc:#111111;--acc-txt:#FFFFFF',
    escuro: '--bg:#16140F;--card:#211E18;--card-2:#2A2620;--border:#3A342A;--border-2:#4A4336;--text:#EFE8DA;--text-2:#CFC6B4;--text-3:#A39A88;--text-4:#7A7262;--acc:#C9A15A;--acc-txt:#16140F;--ouro:#C9A15A'
  };
  function temaTurno(fr) {
    try {
      var d = fr.contentDocument, r = d.documentElement;
      var escuro = document.documentElement.classList.contains('escuro');
      if (escuro) r.setAttribute('data-tema', 'escuro'); else r.removeAttribute('data-tema');
      var st = d.getElementById('app-tema');
      if (!st) { st = d.createElement('style'); st.id = 'app-tema'; d.head.appendChild(st); }
      st.textContent = ':root:not([data-tema="escuro"]){' + TURNO_CORES.claro + '}:root[data-tema="escuro"]{' + TURNO_CORES.escuro + '}';
    } catch (e) {}
  }

  // ---------------------------------------------------------------- rota
  function rota() {
    var h = location.hash.replace(/^#\/?/, '');
    var partes = h.split('/');
    window.scrollTo(0, 0);
    if (partes[0] === 'performance') return telaPerformance();
    if (partes[0] === 'fichas') return telaFichas();
    if (partes[0] === 'ficha') return telaFicha(decodeURIComponent(partes[1] || ''));
    if (partes[0] === 'eventos') return telaEventos();
    if (partes[0] === 'escala') return telaEscala();
    if (partes[0] === 'mais') return telaMais();
    if (partes[0] === 'turno') return telaTurno();
    if (partes[0] === 'coord') return telaCoord();
    if (partes[0] === 'uso') return telaUso();
    return telaChat(partes[0] === 'chat' ? partes[1] || '' : '');
  }

  // O app abre sem sinal pelo sw.js do site (mesma pasta), que guarda o HTML
  // visitado. Só em produção: no teste local a API é a mesma origem.
  // Desde 26/11/2026 o app tem service worker PRÓPRIO (app-sw.js, scope
  // app.html): cópia primeiro, então abre na hora com Wi-Fi ruim ou sem
  // internet. O sw.js do site segue cuidando das outras páginas (o Turno).
  if ('serviceWorker' in navigator && /github\.io$/.test(location.hostname)) {
    navigator.serviceWorker.register('app-sw.js', { scope: 'app.html' }).catch(function () {});
  }

  api('').then(function (p) {
    PERFIL = p;
    if (!p.casa_fixa && ls('app_iz_casa') && !p.casas.some(function (c) { return c.slug === ls('app_iz_casa'); })) ls('app_iz_casa', null);
    desenhaTopo();
    // Troca de tela é momento seguro para entrar a versão nova.
    window.addEventListener('hashchange', function () { if (versaoPronta && tentaAtualizar(true)) return; rota(); });
    rota();
    iniciaUso();
    drena();
    carregaFichas();
    setTimeout(confereVersao, 1500);
    setInterval(function () { if (!document.hidden) confereVersao(); }, 10 * 60 * 1000);
    document.addEventListener('visibilitychange', function () { if (!document.hidden) confereVersao(); });
  }, function (e) {
    document.getElementById('conteudo').innerHTML = '<div class="blk"><p>' + esc(e.status === 0 ? 'Sem internet agora. Abra de novo quando tiver sinal.' : e.message) + '</p><p><a class="btn" href="index.html">Ir para o portal</a> <a class="btn sec" href="index.html?trocar=1">Trocar acesso</a></p></div>';
  });
})();
</script>
</body>
