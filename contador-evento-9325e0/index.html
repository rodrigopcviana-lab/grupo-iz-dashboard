<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Contador de Evento</title>
<meta name="theme-color" content="#16130f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#16130f; --card:#211c15; --card2:#2a2419; --border:#3a3428;
  --text:#f3ede2; --text-2:#c3baa9; --text-3:#8f8672;
  --acc:#d0a352; --acc-txt:#241a06; --verde:#9fe1cb; --amarelo:#e0b05c;
  --a:#d0a352; --b:#8fd0a5;
  --serif:Georgia,"Times New Roman",serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden}
body{
  background:radial-gradient(120% 80% at 50% -10%,#1d1811 0%,var(--bg) 60%);
  color:var(--text); font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  display:flex;flex-direction:column;user-select:none;
}
.topo{flex:0 0 auto;display:flex;align-items:center;gap:16px;padding:9px 18px;
  border-bottom:1px solid var(--border);background:linear-gradient(180deg,rgba(0,0,0,.25),transparent)}
.marca{font-family:var(--serif);font-size:17px;letter-spacing:.3px}
.marca b{color:var(--acc);font-weight:700}
.evento{font-size:12px;color:var(--text-2);border:1px solid var(--border);padding:4px 11px;
  border-radius:999px;background:var(--card)}
.evento b{color:var(--text)}
.topo-total{margin-left:auto;text-align:right;line-height:1}
.topo-total .n{font-family:var(--serif);font-size:26px;color:var(--acc);font-weight:700}
.topo-total .l{font-size:10px;letter-spacing:1.5px;color:var(--text-3);text-transform:uppercase}
.lock{width:38px;height:38px;border-radius:10px;border:1px solid var(--border);background:var(--card);
  color:var(--text-3);display:grid;place-items:center;flex:0 0 auto}
.lock svg{width:18px;height:18px}
.lock.on{color:var(--amarelo);border-color:var(--amarelo)}
.arena{flex:1 1 auto;display:flex;min-height:0;position:relative}
.arena.travado::after{content:"";position:absolute;inset:0;z-index:5}
.lanc{flex:1 1 50%;display:flex;flex-direction:column;min-width:0;min-height:0}
.lanc.a{--c:var(--a)} .lanc.b{--c:var(--b)}
.divisor{width:1px;background:linear-gradient(180deg,transparent,var(--border) 15%,var(--border) 85%,transparent)}

/* --- gate de login por lado --- */
.gate{flex:1 1 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:24px}
.gate .rotulo{font-size:11px;letter-spacing:1.5px;color:var(--text-3);text-transform:uppercase}
.gate input{font:inherit;font-size:20px;text-align:center;letter-spacing:4px;width:100%;max-width:240px;
  background:var(--card);border:1px solid var(--border);border-radius:12px;color:var(--text);padding:14px 10px}
.gate button{font:inherit;font-size:15px;font-weight:700;padding:12px 28px;border-radius:12px;border:none;
  background:var(--c,var(--acc));color:var(--acc-txt);cursor:pointer}
.gate .erro{color:#e07a63;font-size:12.5px;min-height:16px}

.bar-hd{flex:0 0 auto;display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--border);
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 12%,transparent),transparent)}
.avatar{width:44px;height:44px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;font-family:var(--serif);
  font-weight:700;font-size:18px;color:var(--acc-txt);background:var(--c);box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent)}
.bar-id{min-width:0}
.bar-id .nome{font-family:var(--serif);font-size:18px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-id .sub{font-size:11px;color:var(--text-3)}
.bar-id .sub .trocar{color:var(--c);cursor:pointer;border-bottom:1px dotted}
.bar-cont{margin-left:auto;text-align:right;line-height:1}
.bar-cont .n{font-family:var(--serif);font-size:34px;color:var(--c);font-weight:700}
.bar-cont .l{font-size:9px;letter-spacing:1.5px;color:var(--text-3);text-transform:uppercase}

.grade{flex:1 1 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:10px;padding:12px;overflow-y:auto;align-content:start}
.msg-central{flex:1 1 auto;display:flex;align-items:center;justify-content:center;color:var(--text-3);font-size:13px;padding:20px;text-align:center}
.drink{position:relative;border:1px solid var(--border);border-radius:16px;background:linear-gradient(180deg,var(--card2),var(--card));
  padding:14px 12px 12px;min-height:96px;cursor:pointer;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;
  transition:transform .08s ease,box-shadow .12s ease,border-color .12s ease}
.drink:active{transform:scale(.955)}
.drink.hit{border-color:var(--c);box-shadow:0 0 0 2px color-mix(in srgb,var(--c) 45%,transparent),0 8px 22px -8px color-mix(in srgb,var(--c) 60%,transparent)}
.drink .emoji{font-size:22px;position:absolute;top:10px;left:12px;opacity:.9}
.drink .nome{font-family:var(--serif);font-size:15px;line-height:1.15}
.drink .badge{position:absolute;top:9px;right:9px;min-width:26px;height:26px;padding:0 7px;border-radius:999px;
  display:grid;place-items:center;font-weight:800;font-size:14px;background:var(--c);color:var(--acc-txt);
  opacity:0;transform:scale(.5);transition:transform .16s cubic-bezier(.2,1.6,.5,1),opacity .16s}
.drink .badge.on{opacity:1;transform:scale(1)}
.drink .undo{position:absolute;bottom:8px;right:8px;width:24px;height:24px;border-radius:7px;border:1px solid var(--border);
  background:var(--bg);color:var(--text-3);display:none;place-items:center;font-size:15px;line-height:1}
.drink.hit .undo{display:grid}
.plus1{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-family:var(--serif);font-weight:700;
  font-size:34px;color:var(--c);pointer-events:none;opacity:0}
@keyframes flyup{0%{opacity:0;transform:translate(-50%,-30%) scale(.6)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-150%) scale(1.15)}}
.plus1.go{animation:flyup .7s ease-out}

.insumos{flex:0 0 auto;border-top:1px solid var(--border);padding:9px 14px;background:linear-gradient(0deg,rgba(0,0,0,.22),transparent)}
.insumos .cab{font-size:10px;letter-spacing:1.5px;color:var(--text-3);text-transform:uppercase;margin-bottom:6px;display:flex;gap:8px;align-items:center}
.insumos .fila-badge{color:var(--amarelo);font-size:10px;letter-spacing:.5px;text-transform:none}
.insumos .chips{display:flex;flex-wrap:wrap;gap:6px 8px;max-height:52px;overflow:hidden}
.chip{font-size:12px;color:var(--text-2);background:var(--card);border:1px solid var(--border);border-radius:999px;padding:3px 10px;white-space:nowrap}
.chip b{color:var(--text);font-variant-numeric:tabular-nums}
.chip.vazio{color:var(--text-3);border-style:dashed}

/* --- tela de criar/selecionar evento (sem ?evento= na URL) --- */
.picker{flex:1 1 auto;overflow-y:auto;padding:22px 20px 40px;max-width:640px;margin:0 auto;width:100%}
.picker h2{font-family:var(--serif);font-size:16px;margin:0 0 4px;color:var(--acc)}
.picker-sub{font-size:12px;color:var(--text-3);margin:0 0 12px}
.picker-sec{margin-bottom:30px}
.picker-lista{display:flex;flex-direction:column;gap:8px}
.picker-item{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:12px;border:1px solid var(--border);background:var(--card);cursor:pointer;text-align:left;font:inherit;color:var(--text);width:100%}
.picker-item:hover{border-color:var(--acc)}
.picker-item .nome{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.picker-item .meta{font-size:11px;color:var(--text-3);flex:0 0 auto}
.picker-badge{font-size:10px;padding:2px 8px;border-radius:999px;border:1px solid var(--verde);color:var(--verde);flex:0 0 auto}
.picker-vazio{color:var(--text-3);font-size:12.5px}
.picker-form label{font-size:11px;color:var(--text-3);display:block;margin:8px 0 4px}
.picker-form input, .picker-form select{font:inherit;font-size:14px;width:100%;background:var(--card);
  border:1px solid var(--border);border-radius:10px;color:var(--text);padding:9px 12px}
.picker-grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;max-height:260px;
  overflow-y:auto;padding:8px;border:1px solid var(--border);border-radius:12px;margin:8px 0}
.picker-drink{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:9px;border:1px solid var(--border);
  background:var(--card2);font-size:12.5px;cursor:pointer}
.picker-drink.on{border-color:var(--acc);color:var(--acc)}
.picker-btn{font:inherit;font-size:14px;font-weight:700;padding:11px 24px;border-radius:12px;border:none;
  background:var(--acc);color:var(--acc-txt);cursor:pointer;margin-top:10px}
.picker-erro{color:#e07a63;font-size:12.5px;min-height:16px;margin-top:6px}

/* --- modal de relatório / fechar evento (chefe/coord) --- */
.modal{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.62);display:none;
  align-items:flex-start;justify-content:center;padding:24px 16px;overflow-y:auto}
.modal.on{display:flex}
.modal-card{background:var(--card);border:1px solid var(--border);border-radius:18px;
  max-width:560px;width:100%;padding:20px 20px 26px;margin:auto}
.modal-hd{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.modal-hd h2{font-family:var(--serif);font-size:18px;margin:0;color:var(--acc);flex:1}
.modal-x{width:34px;height:34px;border-radius:9px;border:1px solid var(--border);
  background:var(--card2);color:var(--text-3);font-size:16px;cursor:pointer;flex:0 0 auto}
.rel-login label{font-size:11px;color:var(--text-3);display:block;margin-bottom:6px}
.rel-login input{font:inherit;font-size:18px;text-align:center;letter-spacing:4px;width:100%;
  background:var(--card2);border:1px solid var(--border);border-radius:12px;color:var(--text);padding:12px 10px}
.rel-btn{font:inherit;font-size:14px;font-weight:700;padding:12px 22px;border-radius:12px;border:none;
  background:var(--acc);color:var(--acc-txt);cursor:pointer;margin-top:14px;width:100%}
.rel-btn:disabled{opacity:.55;cursor:default}
.rel-erro{color:#e07a63;font-size:12.5px;min-height:16px;margin-top:8px}
.rel-bt{border:1px solid var(--border);border-radius:12px;padding:11px 14px;margin-bottom:9px;background:var(--card2)}
.rel-bt .top{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
.rel-bt .nome{font-family:var(--serif);font-size:15px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rel-bt .tot{font-family:var(--serif);font-size:22px;color:var(--acc);font-weight:700}
.rel-bt .l{font-size:9px;letter-spacing:1.5px;color:var(--text-3);text-transform:uppercase}
.rel-drinks{font-size:12px;color:var(--text-2);line-height:1.5}
.rel-sec-tit{font-size:10px;letter-spacing:1.5px;color:var(--text-3);text-transform:uppercase;margin:18px 0 8px}
.rel-ins{display:flex;flex-wrap:wrap;gap:6px 8px}
.rel-vazio{color:var(--text-3);font-size:12.5px}
.rel-ok{color:var(--verde);font-size:13px;margin-top:10px;line-height:1.5;min-height:16px}

/* --- PTT ao vivo (E10) — walkie-talkie entre os tablets do MESMO evento --- */
.ptt{width:44px;height:44px;border-radius:12px;border:1px solid var(--border);
  background:var(--card2);color:var(--text-2);cursor:pointer;flex:0 0 auto;
  display:none;align-items:center;justify-content:center;touch-action:none}
.ptt.on{display:flex}
.ptt.ligado{border-color:var(--acc);color:var(--acc)}
.ptt.falando{background:#e07a63;border-color:#e07a63;color:#2a0f08}
.ptt svg{width:22px;height:22px}
.ptt-aviso{position:fixed;left:50%;transform:translateX(-50%);bottom:18px;z-index:30;
  background:var(--card);border:1px solid var(--acc);color:var(--text);
  border-radius:999px;padding:9px 18px;font-size:13px;display:none;
  box-shadow:0 6px 24px rgba(0,0,0,.45)}
.ptt-aviso.on{display:block}
</style>
</head>
<body>

<header class="topo">
  <div class="marca">Contador de <b>Evento</b></div>
  <div class="evento" id="evTopo">Carregando evento…</div>
  <div class="topo-total"><div class="n" id="totGeral">0</div><div class="l">drinks na festa</div></div>
  <button class="lock" id="relBtn" title="Relatório / fechar evento (chefe ou coordenador)" type="button" style="display:none">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4h6a1 1 0 0 1 1 1v1h1a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h1V5a1 1 0 0 1 1-1z"/><path d="M9 12h6M9 16h4"/></svg>
  </button>
  <button class="ptt" id="pttBtn" title="Falar com os outros tablets deste evento (segure para falar)" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
  </button>
  <button class="lock" id="lockBtn" title="Travar toques (evita toque sem querer)" type="button">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="10" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
  </button>
</header>

<div class="arena" id="arena">
  <div class="lanc a" id="lanc-a"></div>
  <div class="divisor"></div>
  <div class="lanc b" id="lanc-b"></div>
</div>

<div class="ptt-aviso" id="pttAviso"></div>

<div class="modal" id="relModal">
  <div class="modal-card">
    <div class="modal-hd"><h2>Relatório do evento</h2><button class="modal-x" id="relFechar" type="button">✕</button></div>
    <div id="relBody"></div>
  </div>
</div>

<script>
var CFG = {"workerUrl": "https://contador-evento.rodrigopcviana.workers.dev", "loginWorkerUrl": "https://contagem-bares.rodrigopcviana.workers.dev", "pttAtivo": false};
var params = new URLSearchParams(location.search);
var EVENTO_ID = params.get('evento') || '';

var LADOS = [
  { slug: 'a', ls: 'ce_tok_a' },
  { slug: 'b', ls: 'ce_tok_b' },
];
// estado em memória de cada lado — nunca no localStorage compartilhado
// (portal_sessao): os dois lados precisam de sessões independentes na MESMA
// aba, e localStorage é por-origem, não por-lado.
var sess = { a: null, b: null };      // {token, pessoa, nivel, casa, exp}
var cardapio = null;                  // cardápio do evento (igual pros dois lados)
var contagem = { a: {}, b: {} };      // drinkId -> qtd, por lado (visão local)
var fila = { a: [], b: [] };          // toques ainda não confirmados pelo servidor

function lsFila(slug){ return 'ce_fila_' + slug; }
function carregaFila(slug){
  try { fila[slug] = JSON.parse(localStorage.getItem(lsFila(slug)) || '[]'); } catch(e){ fila[slug] = []; }
}
function salvaFila(slug){
  try { localStorage.setItem(lsFila(slug), JSON.stringify(fila[slug])); } catch(e){}
}

function sessaoLer(slug){
  try {
    var raw = localStorage.getItem('ce_tok_' + slug);
    if (!raw) return null;
    var s = JSON.parse(raw);
    if (!s || !s.token || !s.exp || Date.now() > s.exp) return null;
    return s;
  } catch(e){ return null; }
}
function sessaoSalvar(slug, s){
  try { localStorage.setItem('ce_tok_' + slug, JSON.stringify(s)); } catch(e){}
}
function sessaoLimpar(slug){
  try { localStorage.removeItem('ce_tok_' + slug); } catch(e){}
}

// Timeout em toda chamada de rede: sem isso, uma conexão que aceita a
// requisição mas nunca responde (wifi de bar em captive-portal, Worker
// momentaneamente travado) prende o fetch pra sempre — o loop da fila só
// reage a sucesso/erro, nunca a "não respondeu nada" (achado na revisão
// adversarial da E5). 10s é generoso pra uma chamada que deveria levar
// menos de 1s; se estourar, cai no catch como se fosse erro de rede normal.
function fetchComTimeout(url, opts, ms){
  var ctrl = new AbortController();
  var t = setTimeout(function(){ ctrl.abort(); }, ms || 10000);
  return fetch(url, Object.assign({}, opts, { signal: ctrl.signal })).finally(function(){ clearTimeout(t); });
}

// ------------------------------------------------------------ PTT ao vivo ---
// PLANO_INTERCOM_VOZ.md E10 (Onda 3). Walkie-talkie entre os tablets do MESMO
// evento: segura o botão, fala, solta → toca nos outros ~1s depois.
//
// EFÊMERO POR CONSTRUÇÃO: o áudio vai pro Worker, é repassado e some. Não
// grava em lugar nenhum, não transcreve. É o oposto do canal assíncrono do
// Intercom (`canais.html`), que existe justamente pra deixar registro — e é
// por isso que aqui não há aviso de retenção pra dar: não há retenção.
//
// DESLIGADO por padrão (CFG.pttAtivo): a E10 exige prova de que a Onda 1
// pegou, e o piloto E6 só fecha em 2026-09-01. Com o flag off, o botão nem
// entra no DOM visível e nenhum socket é aberto.
var ptt = {
  ws: null, gravando: false, rec: null, chunks: [], mime: '',
  conectado: false, tentativas: 0, timerFala: null,
};
var PTT_MAX_MS = 15000;   // teto por fala — o Worker corta em 512 KB de qualquer jeito

function pttTokenAtual(){
  // O PTT é do TABLET, não de um lado: usa a sessão de quem estiver logado
  // (A tem preferência). Sem ninguém logado não há o que autenticar.
  var s = sess.a || sess.b;
  return s && s.token ? s.token : null;
}

function pttAviso(texto){
  var el = document.getElementById('pttAviso');
  if (!el) return;
  if (!texto) { el.classList.remove('on'); return; }
  el.textContent = texto;
  el.classList.add('on');
}

function pttMimeSuportado(){
  if (typeof MediaRecorder === 'undefined') return '';
  var tentar = ['audio/webm;codecs=opus','audio/webm','audio/mp4'];
  for (var i=0;i<tentar.length;i++){
    if (MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(tentar[i])) return tentar[i];
  }
  return '';
}

function pttConecta(){
  if (!CFG.pttAtivo || !EVENTO_ID) return;
  var token = pttTokenAtual();
  if (!token) return;                       // ninguém logado ainda
  if (ptt.ws && ptt.ws.readyState <= 1) return;

  var base = CFG.workerUrl.replace(/^http/, 'ws');
  var ws;
  try {
    ws = new WebSocket(base + '/api/evento/ptt?eventoId=' + encodeURIComponent(EVENTO_ID));
  } catch(e){ return; }
  ws.binaryType = 'arraybuffer';
  ptt.ws = ws;

  ws.onopen = function(){
    // Token no CORPO da primeira mensagem, nunca na URL: URL de WebSocket
    // entra em log de servidor, e token de sessão em log é vazamento mudo.
    ws.send(JSON.stringify({ t:'auth', token: pttTokenAtual(), mime: (ptt.mime || 'audio/webm').split(';')[0] }));
  };

  ws.onmessage = function(ev){
    if (typeof ev.data === 'string') {
      var d;
      try { d = JSON.parse(ev.data); } catch(e){ return; }
      if (d.t === 'pronto') {
        ptt.conectado = true; ptt.tentativas = 0;
        document.getElementById('pttBtn').classList.add('ligado');
      } else if (d.t === 'erro') {
        pttAviso(d.erro || 'falha no rádio');
        setTimeout(function(){ pttAviso(''); }, 2500);
      }
      return;
    }
    pttToca(ev.data);
  };

  ws.onclose = function(){
    ptt.conectado = false;
    var b = document.getElementById('pttBtn');
    if (b) b.classList.remove('ligado');
    // Reconexão com recuo: evento de 4h num wifi de bar cai, e um loop de
    // reconexão apertado só piora. Teto de 30s.
    if (!CFG.pttAtivo) return;
    ptt.tentativas = Math.min(ptt.tentativas + 1, 6);
    setTimeout(pttConecta, Math.min(1000 * Math.pow(2, ptt.tentativas), 30000));
  };
  ws.onerror = function(){ /* onclose cuida do retry */ };
}

// Recebe [2 bytes de tamanho][cabeçalho JSON][áudio] — o cabeçalho é montado
// pelo SERVIDOR, então `de` é identidade verificada, não algo que outro
// cliente possa forjar.
function pttToca(buf){
  try {
    var view = new DataView(buf);
    var n = view.getUint16(0);
    var cab = JSON.parse(new TextDecoder().decode(new Uint8Array(buf, 2, n)));
    var audio = new Blob([new Uint8Array(buf, 2 + n)], { type: cab.mime || 'audio/webm' });
    var url = URL.createObjectURL(audio);
    var el = new Audio(url);
    pttAviso(cab.de + ' está falando');
    el.onended = el.onerror = function(){
      URL.revokeObjectURL(url);
      pttAviso('');
    };
    el.play().catch(function(){
      // Autoplay bloqueado (tablet que ainda não recebeu toque nenhum):
      // avisa em vez de engolir a fala em silêncio.
      pttAviso(cab.de + ' chamou — toque na tela pra ouvir');
      URL.revokeObjectURL(url);
    });
  } catch(e){ /* quadro corrompido — descarta, nunca derruba a tela */ }
}

async function pttComeca(){
  if (ptt.gravando || !ptt.conectado) return;
  if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
  var mime = ptt.mime || pttMimeSuportado();
  if (!mime) { pttAviso('este aparelho não grava áudio'); setTimeout(function(){pttAviso('');},2500); return; }
  ptt.mime = mime;
  var stream;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio:true });
  } catch(e){
    pttAviso('sem permissão de microfone');
    setTimeout(function(){ pttAviso(''); }, 2800);
    return;
  }
  ptt.chunks = [];
  try { ptt.rec = new MediaRecorder(stream, { mimeType: mime }); }
  catch(e){ stream.getTracks().forEach(function(t){t.stop();}); return; }

  ptt.rec.ondataavailable = function(e){ if (e.data && e.data.size) ptt.chunks.push(e.data); };
  ptt.rec.onstop = function(){
    stream.getTracks().forEach(function(t){ t.stop(); });   // solta o microfone SEMPRE
    var blob = new Blob(ptt.chunks, { type: mime });
    ptt.chunks = [];
    if (blob.size && ptt.ws && ptt.ws.readyState === 1) {
      blob.arrayBuffer().then(function(ab){
        try { ptt.ws.send(ab); } catch(e){ /* caiu no meio — a fala se perde, e é assim mesmo num rádio */ }
      });
    }
  };
  ptt.rec.start();
  ptt.gravando = true;
  document.getElementById('pttBtn').classList.add('falando');
  pttAviso('no ar');
  // Teto duro: dedo preso no botão (ou tablet na bandeja) não pode abrir
  // microfone eterno — o §2 do plano rejeita microfone aberto em bar cheio.
  ptt.timerFala = setTimeout(pttPara, PTT_MAX_MS);
}

function pttPara(){
  if (!ptt.gravando) return;
  ptt.gravando = false;
  if (ptt.timerFala) { clearTimeout(ptt.timerFala); ptt.timerFala = null; }
  try { if (ptt.rec && ptt.rec.state !== 'inactive') ptt.rec.stop(); } catch(e){}
  var b = document.getElementById('pttBtn');
  if (b) b.classList.remove('falando');
  pttAviso('');
}

function pttLiga(){
  if (!CFG.pttAtivo) return;
  var b = document.getElementById('pttBtn');
  if (!b) return;
  b.classList.add('on');
  // pointer* cobre toque e mouse com um par de eventos só. pointercancel e
  // pointerleave são obrigatórios: sem eles, o dedo que escorrega pra fora do
  // botão deixa a gravação aberta pra sempre.
  b.addEventListener('pointerdown', function(e){ e.preventDefault(); pttComeca(); });
  ['pointerup','pointercancel','pointerleave'].forEach(function(ev){
    b.addEventListener(ev, function(){ pttPara(); });
  });
  // Aba escondida (tablet bloqueado no meio da fala) fecha o microfone.
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState !== 'visible') pttPara();
  });
  pttConecta();
}

function uuid(){
  if (crypto.randomUUID) return crypto.randomUUID();
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c){
    var r = Math.random()*16|0, v = c === 'x' ? r : (r&0x3|0x8); return v.toString(16);
  });
}

function fmtMl(ml){
  return ml >= 1000 ? (ml/1000).toFixed(ml%1000===0?0:2).replace('.',',') + ' L' : Math.round(ml) + ' ml';
}

async function login(slug, senha){
  var r;
  try {
    r = await fetchComTimeout(CFG.loginWorkerUrl + '/api/nivel', {
      method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({senha:senha}),
    });
  } catch(e){ return { erro: 'rede' }; } // sem rede/timeout — distinto de senha errada (login exige rede)
  if (!r.ok) return { erro: 'senha' };
  var d = await r.json();
  if (!d.token || !['bartender','chefe','coord'].includes(d.nivel)) return { erro: 'senha' };
  return { sessao: { token:d.token, pessoa:d.pessoa || d.nivel, nivel:d.nivel, casa:d.casa, exp:d.exp } };
}

async function carregaCardapio(token){
  var r;
  try {
    r = await fetchComTimeout(CFG.workerUrl + '/api/evento/cardapio?eventoId=' + encodeURIComponent(EVENTO_ID), {
      headers: { 'X-Token': token },
    });
  } catch(e){ return { erro: 'rede' }; }
  if (r.status === 401) return { erro: 'sessao' };
  if (!r.ok) return { erro: 'nao_encontrado' };
  return { dado: await r.json() };
}

// Depois de buscar o placar do servidor, reaplica por cima os toques que
// ainda estão na fila local (não confirmados) — sem isso, um reload da
// página com toques pendentes fazia a contagem exibida VOLTAR pra trás (o
// snapshot do servidor não inclui o que ainda não sincronizou) e nunca mais
// se corrigia sozinha, mesmo depois da fila esvaziar (achado na revisão
// adversarial da E5 — ver PLANO_CONTADOR_EVENTO.md).
function aplicaFilaPendente(slug){
  fila[slug].forEach(function(item){
    var atual = contagem[slug][item.drinkId] || 0;
    contagem[slug][item.drinkId] = Math.max(0, atual + item.delta);
  });
}

async function carregaEstadoServidor(slug){
  var s = sess[slug]; if (!s) return;
  try {
    var r = await fetchComTimeout(CFG.workerUrl + '/api/evento/estado?eventoId=' + encodeURIComponent(EVENTO_ID), {
      headers: { 'X-Token': s.token },
    });
    if (!r.ok) return;
    var estado = await r.json();
    var meu = (estado.porPessoa || {})[s.pessoa];
    if (meu) contagem[slug] = Object.assign({}, meu);
  } catch(e){ /* offline — segue só com o que já está na tela */ }
}

async function enviaToque(slug, drinkId, delta){
  var s = sess[slug]; if (!s) return;
  var item = { eventoId: EVENTO_ID, drinkId: drinkId, delta: delta, toqueId: uuid() };
  fila[slug].push(item); salvaFila(slug);
  tentaEsvaziarFila(slug);
}

// Trava de reentrância: sem isso, toques rápidos (cada um chama
// tentaEsvaziarFila) disparavam a MESMA fila em paralelo — a 2ª chamada lia
// fila[0] antes da 1ª terminar seu await e reenviava o item ainda não
// removido, duplicando requisição (achado testando com 3 toques em sequência
// na E3). O toqueId protege o DADO final no Worker (idempotente), mas a
// requisição redundante é desperdício evitável — uma corrida por lado basta.
var filaRodando = { a: false, b: false };

async function tentaEsvaziarFila(slug){
  var s = sess[slug]; if (!s || !fila[slug].length || filaRodando[slug]) return;
  filaRodando[slug] = true;
  try {
    while (fila[slug].length) {
      var item = fila[slug][0];
      try {
        var r = await fetchComTimeout(CFG.workerUrl + '/api/evento/toque', {
          method:'POST', headers:{'Content-Type':'application/json','X-Token':s.token}, body: JSON.stringify(item),
        });
        if (r.status === 401) {
          // Token expirado no meio do evento (validade 12h) — SEM isto, a
          // fila tentava pra sempre contra sessão morta, a cada 8s, sem
          // nunca avisar o bartender (achado na revisão adversarial da E5).
          // Os itens ficam na fila (persistidos) — ao logar de novo, o mesmo
          // fluxo de iniciaLado() retoma o envio deles.
          sessaoLimpar(slug); sess[slug] = null;
          montaGate2(slug);
          return;
        }
        if (!r.ok) break; // erro do servidor (5xx, etc.) — para e tenta de novo depois
        fila[slug].shift(); salvaFila(slug);
        render(slug); // atualiza o badge "aguardando rede" — sem isto ele ficava
                       // preso mostrando a contagem de quando o toque foi feito,
                       // mesmo depois de tudo já sincronizado (achado testando).
      } catch(e){ break; } // sem rede/timeout — para, tenta de novo no próximo gatilho
    }
  } finally {
    filaRodando[slug] = false;
  }
}
window.addEventListener('online', function(){ tentaEsvaziarFila('a'); tentaEsvaziarFila('b'); });
setInterval(function(){ tentaEsvaziarFila('a'); tentaEsvaziarFila('b'); }, 8000);

function somaInsumosLocal(qtdPorDrink){
  var porInsumo = {};
  (cardapio.drinks || []).forEach(function(d){
    var q = qtdPorDrink[d.id] || 0;
    if (!q) return;
    (d.ficha || []).forEach(function(it){
      var chave = it.insumo + '|' + it.unid;
      porInsumo[chave] = (porInsumo[chave] || 0) + it.qtd * q;
    });
  });
  return Object.keys(porInsumo).sort(function(x,y){ return porInsumo[y]-porInsumo[x]; })
    .map(function(k){ var p=k.split('|'); return {insumo:p[0], unid:p[1], total:porInsumo[k]}; });
}

function montaGate(slug){
  var wrap = document.createElement('div');
  wrap.className = 'gate';
  wrap.innerHTML =
    '<div class="rotulo">Login do bartender · lado ' + slug.toUpperCase() + '</div>' +
    '<input type="password" placeholder="senha" id="senha-' + slug + '">' +
    '<button id="entrar-' + slug + '">Entrar</button>' +
    '<div class="erro" id="erro-' + slug + '"></div>';
  var btn = wrap.querySelector('#entrar-' + slug);
  var input = wrap.querySelector('#senha-' + slug);
  var erro = wrap.querySelector('#erro-' + slug);
  async function tenta(){
    var senha = input.value.trim(); if (!senha) return;
    btn.disabled = true; erro.textContent = '';
    var res = await login(slug, senha);
    btn.disabled = false;
    if (res.erro === 'rede') { erro.textContent = 'sem conexão — tente de novo'; return; } // mantém a senha digitada
    if (res.erro) { erro.textContent = 'senha inválida'; input.value=''; input.focus(); return; }
    sessaoSalvar(slug, res.sessao);
    sess[slug] = res.sessao;
    await iniciaLado(slug);
    pttConecta();   // agora existe token neste tablet — ver PTT ao vivo (E10)
  }
  btn.addEventListener('click', tenta);
  input.addEventListener('keydown', function(e){ if (e.key === 'Enter') tenta(); });
  return wrap;
}

function montaLancador(slug){
  var s = sess[slug];
  var wrap = document.getElementById('lanc-' + slug);
  wrap.innerHTML = '';
  wrap.className = 'lanc ' + slug;
  wrap.innerHTML =
   '<div class="bar-hd">' +
     '<div class="avatar">' + (s.pessoa || '?')[0] + '</div>' +
     '<div class="bar-id"><div class="nome">' + s.pessoa + '</div>' +
       '<div class="sub">' + (s.nivel === 'bartender' ? 'bartender' : s.nivel) + ' · <span class="trocar" id="trocar-' + slug + '">trocar</span></div></div>' +
     '<div class="bar-cont"><div class="n" id="cont-' + slug + '">0</div><div class="l">drinks feitos</div></div>' +
   '</div>' +
   '<div class="grade" id="grade-' + slug + '"></div>' +
   '<div class="insumos"><div class="cab">Insumos consumidos <span class="fila-badge" id="fila-' + slug + '"></span></div>' +
     '<div class="chips" id="ins-' + slug + '"></div></div>';

  document.getElementById('trocar-' + slug).addEventListener('click', async function(){
    // Bloqueia troca com toques ainda não sincronizados: se A tem toques na
    // fila e alguém troca pra B antes deles sincronizarem, esses toques
    // (enviados com o token de QUEM estiver logado no momento do envio) iam
    // parar no nome de B — atribuição errada de drink (achado na revisão
    // adversarial da E5). Tenta esvaziar antes de bloquear, caso a rede
    // volte bem na hora.
    if (fila[slug].length) {
      await tentaEsvaziarFila(slug);
      if (fila[slug].length) {
        alert('Ainda há ' + fila[slug].length + ' toque(s) não sincronizado(s) neste lado. Espere a conexão voltar antes de trocar de bartender.');
        return;
      }
    }
    sessaoLimpar(slug); sess[slug] = null; contagem[slug] = {};
    montaGate2(slug);
  });

  var grade = document.getElementById('grade-' + slug);
  (cardapio.drinks || []).forEach(function(d){
    var b = document.createElement('button');
    b.className = 'drink'; b.dataset.id = d.id;
    b.innerHTML = '<span class="emoji">' + (d.emoji || '🍸') + '</span>' +
      '<span class="badge" id="bd-' + slug + '-' + d.id + '">0</span>' +
      '<span class="plus1">+1</span>' +
      '<span class="nome">' + d.nome + '</span>' +
      '<button class="undo" title="Corrigir −1">–</button>';
    b.addEventListener('click', function(e){
      if (e.target.classList.contains('undo')) { golpe(slug, d, b, -1); e.stopPropagation(); return; }
      golpe(slug, d, b, 1);
    });
    grade.appendChild(b);
  });
  render(slug);
}

function golpe(slug, d, btn, delta){
  var atual = contagem[slug][d.id] || 0;
  contagem[slug][d.id] = Math.max(0, atual + delta);
  if (delta > 0) {
    var p = btn.querySelector('.plus1'); p.classList.remove('go'); void p.offsetWidth; p.classList.add('go');
    if (navigator.vibrate) navigator.vibrate(18);
  }
  enviaToque(slug, d.id, delta);
  render(slug);
}

function render(slug){
  var totBar = 0;
  (cardapio.drinks || []).forEach(function(d){
    var q = contagem[slug][d.id] || 0;
    var badge = document.getElementById('bd-' + slug + '-' + d.id);
    if (!badge) return;
    var card = badge.closest('.drink');
    badge.textContent = q; badge.classList.toggle('on', q > 0); card.classList.toggle('hit', q > 0);
    totBar += q;
  });
  var contEl = document.getElementById('cont-' + slug); if (contEl) contEl.textContent = totBar;
  var box = document.getElementById('ins-' + slug);
  if (box) {
    var ins = somaInsumosLocal(contagem[slug]);
    box.innerHTML = ins.length
      ? ins.map(function(i){ return '<span class="chip">' + i.insumo + ' <b>' + fmtMl(i.total) + '</b></span>'; }).join('')
      : '<span class="chip vazio">nada lançado ainda</span>';
  }
  var filaBadge = document.getElementById('fila-' + slug);
  if (filaBadge) filaBadge.textContent = fila[slug].length ? (fila[slug].length + ' aguardando rede') : '';

  var g = 0;
  ['a','b'].forEach(function(sl){ Object.keys(contagem[sl]).forEach(function(k){ g += contagem[sl][k]; }); });
  var totGeral = document.getElementById('totGeral'); if (totGeral) totGeral.textContent = g;
}

function montaGate2(slug){
  var wrap = document.getElementById('lanc-' + slug);
  wrap.innerHTML = '';
  wrap.className = 'lanc ' + slug;
  wrap.appendChild(montaGate(slug));
}

async function iniciaLado(slug){
  var s = sess[slug];
  if (!cardapio) {
    var res = await carregaCardapio(s.token);
    if (res.erro === 'sessao') {
      // Token expirado/inválido — NÃO é "evento não encontrado", é sessão
      // vencida deste lado. Limpa só este lado e volta pro login (achado
      // testando: as duas mensagens eram iguais e confundiam o bartender).
      sessaoLimpar(slug); sess[slug] = null;
      montaGate2(slug);
      return;
    }
    if (res.erro === 'rede') {
      var wrapR = document.getElementById('lanc-' + slug);
      wrapR.innerHTML = '<div class="msg-central">Sem conexão pra carregar o evento. Verifique o wifi e recarregue a página.</div>';
      return;
    }
    if (res.erro) {
      var wrap = document.getElementById('lanc-' + slug);
      wrap.innerHTML = '<div class="msg-central">Evento não encontrado no cardápio (eventoId="' + EVENTO_ID + '"). Confira o link.</div>';
      return;
    }
    cardapio = res.dado;
    var pin = '<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:4px"><path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11z"/><circle cx="12" cy="10" r="2.4"/></svg>';
    document.getElementById('evTopo').innerHTML = pin + '<b>' + cardapio.nome + '</b> · ' + (cardapio.casa || '').toUpperCase() + ' · ' + (cardapio.data || '');
  }
  carregaFila(slug);
  await carregaEstadoServidor(slug);
  aplicaFilaPendente(slug); // reconcilia o snapshot do servidor com toques ainda não sincronizados
  montaLancador(slug);
  tentaEsvaziarFila(slug);
}

  body.innerHTML =
    '<div class="rel-login">' +
      '<label>Senha de chefe ou coordenador</label>' +
      '<input type="password" id="rel-senha" placeholder="senha">' +
      '<button class="rel-btn" id="rel-entrar">Ver relatório</button>' +
      '<div class="rel-erro" id="rel-erro">' + (msg || '') + '</div>' +
    '</div>';
  var inp = document.getElementById('rel-senha');
  var btn = document.getElementById('rel-entrar');
  var erro = document.getElementById('rel-erro');
  async function tenta(){
    var senha = inp.value.trim(); if (!senha) return;
    btn.disabled = true; erro.textContent = '';
    var res = await login('admin', senha); // reusa login(); 'admin' é só rótulo de slug
    btn.disabled = false;
    if (res.erro === 'rede') { erro.textContent = 'sem conexão — tente de novo'; return; }
    if (res.erro) { erro.textContent = 'senha inválida'; inp.value = ''; inp.focus(); return; }
    if (!['chefe','coord'].includes(res.sessao.nivel)) {
      // senha de bartender é válida, mas não pode fechar evento
      erro.textContent = 'essa senha não tem permissão de chefe/coordenador'; inp.value = ''; inp.focus(); return;
    }
    admin = res.sessao;
    carregaRelatorio();
  }
  btn.addEventListener('click', tenta);
  inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') tenta(); });
  inp.focus();
}

async function carregaRelatorio(){
  var body = document.getElementById('relBody');
  body.innerHTML = '<p class="rel-vazio">Carregando…</p>';
  // garante nomes dos drinks no relatório mesmo se nenhum lado estiver logado
  if (!cardapio) {
    var c = await carregaCardapio(admin.token);
    if (c.dado) cardapio = c.dado;
  }
  var r;
  try {
    r = await fetchComTimeout(CFG.workerUrl + '/api/evento/relatorio?eventoId=' + encodeURIComponent(EVENTO_ID), {
      headers: { 'X-Token': admin.token },
    });
  } catch(e){ body.innerHTML = '<p class="rel-erro">sem conexão — feche e abra de novo</p>'; return; }
  if (r.status === 401) { admin = null; telaLoginAdmin('sessão expirada, entre de novo'); return; }
  if (!r.ok) { body.innerHTML = '<p class="rel-erro">erro ao carregar o relatório</p>'; return; }
  renderRelatorio(await r.json());
}

function renderRelatorio(d){
  var body = document.getElementById('relBody');
  var lista = d.porBartender || [];
  var totalGeral = lista.reduce(function(a,b){ return a + b.total; }, 0);
  var partes = [];
  partes.push('<div class="rel-sec-tit">Por bartender · ' + totalGeral + ' drinks no total</div>');
  if (!lista.length) {
    partes.push('<p class="rel-vazio">Nenhum toque registrado ainda.</p>');
  } else {
    lista.forEach(function(b){
      var drinksTxt = Object.keys(b.drinks).map(function(id){
        var dr = ((cardapio && cardapio.drinks) || []).find(function(x){ return x.id === id; });
        return (dr ? dr.nome : id) + ' ×' + b.drinks[id];
      }).join(' · ');
      partes.push(
        '<div class="rel-bt"><div class="top"><span class="nome">' + b.pessoa + '</span>' +
        '<span class="tot">' + b.total + '</span><span class="l">drinks</span></div>' +
        '<div class="rel-drinks">' + (drinksTxt || '—') + '</div></div>');
    });
  }
  partes.push('<div class="rel-sec-tit">Insumos totais do evento</div>');
  var ins = d.insumosTotais || [];
  partes.push(ins.length
    ? '<div class="rel-ins">' + ins.map(function(i){ return '<span class="chip">' + i.insumo + ' <b>' + fmtQtdRel(i) + '</b></span>'; }).join('') + '</div>'
    : '<p class="rel-vazio">nada lançado ainda</p>');
  partes.push('<button class="rel-btn" id="rel-fechar-ev"' + (totalGeral ? '' : ' disabled') + '>Fechar evento e gravar no histórico</button>');
  partes.push('<div class="rel-erro" id="rel-fechar-erro"></div>');
  partes.push('<div class="rel-ok" id="rel-fechar-ok"></div>');
  body.innerHTML = partes.join('');
  var fb = document.getElementById('rel-fechar-ev');
  if (fb) fb.addEventListener('click', fechaEvento);
}

async function fechaEvento(){
  var btn = document.getElementById('rel-fechar-ev');
  var erro = document.getElementById('rel-fechar-erro');
  var ok = document.getElementById('rel-fechar-ok');
  erro.textContent = ''; ok.textContent = '';
  if (!confirm('Fechar o evento agora? Grava o resumo por bartender no histórico (Notion). Pode fechar de novo depois — atualiza os mesmos registros, não duplica.')) return;
  btn.disabled = true; var rotulo = btn.textContent; btn.textContent = 'Gravando…';
  var r;
  try {
    // Notion pode gravar várias páginas — timeout mais folgado que o padrão.
    r = await fetchComTimeout(CFG.workerUrl + '/api/evento/fechar', {
      method:'POST', headers:{'Content-Type':'application/json','X-Token':admin.token},
      body: JSON.stringify({ eventoId: EVENTO_ID }),
    }, 30000);
  } catch(e){ erro.textContent = 'sem conexão — tente de novo'; btn.disabled = false; btn.textContent = rotulo; return; }
  if (r.status === 401) { admin = null; telaLoginAdmin('sessão expirada, entre de novo'); return; }
  var d = await r.json().catch(function(){ return {}; });
  if (!r.ok) { erro.textContent = d.erro || 'erro ao fechar'; btn.disabled = false; btn.textContent = rotulo; return; }
  var n = (d.gravados || []).length;
  ok.textContent = 'Evento fechado — ' + n + ' linha(s) gravada(s) no histórico.';
  btn.textContent = 'Fechar de novo (atualiza)'; btn.disabled = false;
}

async function init(){
  if (!EVENTO_ID) {
    await montaPicker();
    return;
  }
  document.getElementById('relBtn').style.display = 'grid';
  document.getElementById('relBtn').addEventListener('click', abreRelatorio);
  document.getElementById('relFechar').addEventListener('click', fechaModal);
  document.getElementById('relModal').addEventListener('click', function(e){
    if (e.target === this) fechaModal(); // clicar no fundo escuro fecha
  });
  for (var i = 0; i < LADOS.length; i++) {
    var slug = LADOS[i].slug;
    var restaurada = sessaoLer(slug);
    if (restaurada) { sess[slug] = restaurada; await iniciaLado(slug); }
    else montaGate2(slug);
  }
  pttLiga();   // PTT ao vivo (E10) — no-op quando CFG.pttAtivo é false
}

document.getElementById('lockBtn').addEventListener('click', function(){
  var arena = document.getElementById('arena');
  var travado = arena.classList.toggle('travado');
  this.classList.toggle('on', travado);
});

init();
</script>

<style>
  /* var(--x, fallback) em tudo: este mesmo bloco é reusado nas subpastas
     (Minha Central, Contador de Evento), que têm paleta própria — e a
     ausência de uma variável não pode deixar o aviso ilegível. */
  .ver-nova { position: fixed; left: 12px; right: 12px; top: calc(10px + env(safe-area-inset-top, 0px));
    z-index: 96; margin: 0 auto; max-width: 460px; display: none;
    background: #2c2416; border: 1px solid var(--acc, #d8b26e); border-radius: 12px;
    padding: 10px 12px; box-shadow: 0 8px 24px rgba(0,0,0,.45);
    align-items: center; gap: 10px; }
  .ver-nova.on { display: flex; }
  .ver-nova svg { flex: none; color: var(--acc, #d8b26e); }
  .vn-txt { flex: 1; font-size: 12.5px; color: var(--text-2, #c9cdd6); line-height: 1.4; }
  .vn-txt b { color: var(--text, #f3ede2); }
  .vn-ok { flex: none; font-size: 12px; font-weight: 600; padding: 7px 12px;
    border-radius: 999px; cursor: pointer; background: var(--acc, #d8b26e); border: none;
    color: var(--acc-txt, #16130f); }
  .vn-x { flex: none; background: none; border: none; color: var(--text-2, #c9cdd6);
    font-size: 18px; line-height: 1; cursor: pointer; padding: 2px 4px; }
</style>
<div class="ver-nova" id="ver-nova" role="status" aria-live="polite">
  <svg class="ic" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 3.5V9h-5.5"/></svg>
  <div class="vn-txt"><b>Nova versão disponível.</b> Atualize pra ver o conteúdo mais recente.</div>
  <button type="button" class="vn-ok" id="vn-ok">Atualizar</button>
  <button type="button" class="vn-x" id="vn-x" aria-label="Dispensar">&times;</button>
</div>
<script>
(function () {
  var BUILD = '9ccf111ca9e0';
  var ALVO = 'versao.json';
  var MIN_ENTRE = 60000;      // não martelar a rede a cada troca de aba
  var ultimo = 0, mostrando = false;

  function mostra(novo) {
    if (mostrando) return;
    if (localStorage.getItem('bariz_build_dispensado') === novo) return;
    mostrando = true;
    var box = document.getElementById('ver-nova');
    if (!box) return;
    box.classList.add('on');
    document.getElementById('vn-x').onclick = function () {
      try { localStorage.setItem('bariz_build_dispensado', novo); } catch (e) {}
      box.classList.remove('on');
    };
    document.getElementById('vn-ok').onclick = atualiza;
  }

  // Limpa TODOS os caches do service worker e recarrega. Sem isso um reload
  // comum ainda seria atendido pela casca cacheada (css/ícones).
  function atualiza() {
    var feito = false;
    var recarrega = function () { if (feito) return; feito = true; location.reload(); };
    setTimeout(recarrega, 2500);   // rede travada não pode prender o usuário
    var t = [];
    try {
      if (window.caches && caches.keys) {
        t.push(caches.keys().then(function (ks) {
          return Promise.all(ks.map(function (k) { return caches.delete(k); }));
        }));
      }
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
        t.push(navigator.serviceWorker.getRegistration().then(function (r) { return r && r.update(); }));
      }
    } catch (e) {}
    Promise.all(t).then(recarrega, recarrega);
  }

  function confere() {
    if (mostrando) return;
    var agora = Date.now();
    if (agora - ultimo < MIN_ENTRE) return;
    ultimo = agora;
    fetch(ALVO + '?t=' + agora, { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { if (d && d.build && d.build !== BUILD) mostra(d.build); })
      .catch(function () {});
  }

  // Exposto pro botão manual "Buscar atualização" (meu-perfil.html).
  window.barizAtualiza = atualiza;
  window.barizConfere = function () { ultimo = 0; confere(); };

  setTimeout(confere, 4000);                       // não competir com o render
  setInterval(function () { if (!document.hidden) confere(); }, 600000);
  document.addEventListener('visibilitychange', function () {
    // o caso que só isto alcança: app em standalone voltando do alternador.
    if (!document.hidden) confere();
  });
})();
</script>
