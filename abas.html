<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0f0d0a">
<title>Bar.IZ</title>
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Bar.IZ">
<style>
  :root {
    --bg: #16130f; --topo: #0f0d0a; --card: #211c15; --border: #3a3428;
    --text: #f3ede2; --text-2: #c3baa9; --text-3: #8f8672;
    --acc: #d0a352; --acc-txt: #241a06;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { height: 100%; margin: 0; overflow: hidden; }
  body { display: flex; flex-direction: column; background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif; -webkit-text-size-adjust: 100%; }
  button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
  .ab-topo { flex: none; background: var(--topo); border-bottom: 1px solid var(--border);
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) 0 env(safe-area-inset-left, 0px); }

  /* PC: barra de abas */
  .ab-pc { display: flex; align-items: flex-end; gap: 4px; padding: 6px 8px 0; }
  .ab-lista { display: flex; flex: 0 1 auto; min-width: 0; gap: 2px; overflow-x: auto; scrollbar-width: none; }
  .ab-lista::-webkit-scrollbar { display: none; }
  .ab-aba { display: flex; align-items: center; gap: 4px; flex: 0 1 200px; min-width: 104px; height: 34px;
    padding: 0 4px 0 12px; border-radius: 8px 8px 0 0; color: var(--text-3); font-size: 13px;
    cursor: pointer; user-select: none; -webkit-user-select: none; outline-offset: -2px; }
  .ab-aba:hover { background: var(--card); color: var(--text-2); }
  .ab-aba.on { background: var(--bg); color: var(--text); box-shadow: inset 0 2px 0 var(--acc); }
  .ab-t { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ab-x { flex: none; width: 22px; height: 22px; display: grid; place-items: center; padding: 0;
    border: 0; border-radius: 6px; background: none; color: var(--text-3); cursor: pointer; opacity: 0; }
  .ab-aba:hover .ab-x, .ab-aba.on .ab-x, .ab-aba:focus-within .ab-x { opacity: 1; }
  .ab-x:hover { background: var(--border); color: var(--text); }
  .ab-mais { flex: none; width: 30px; height: 30px; margin-bottom: 2px; display: grid; place-items: center;
    padding: 0; border: 0; border-radius: 8px; background: none; color: var(--text-2); cursor: pointer; }
  .ab-mais:hover { background: var(--card); color: var(--text); }

  /* Celular: título da aba atual + "+" + contador */
  .ab-movel { display: none; }
  @media (max-width: 767px) {
    .ab-pc { display: none; }
    .ab-movel { display: flex; align-items: center; gap: 2px; height: 44px; padding: 0 4px 0 14px; }
    .ab-m-titulo { flex: 1; min-width: 0; padding: 10px 0; text-align: left; background: none; border: 0;
      font-size: 14px; font-weight: 600; color: var(--text); cursor: pointer;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .ab-m-mais, .ab-m-abas { flex: none; width: 42px; height: 42px; display: grid; place-items: center;
      padding: 0; background: none; border: 0; color: var(--text-2); cursor: pointer; }
    .ab-m-abas span { min-width: 24px; height: 24px; padding: 0 4px; display: grid; place-items: center;
      border: 2px solid currentColor; border-radius: 6px; font-size: 12px; font-weight: 700; line-height: 1; }
  }

  /* Páginas: um iframe por aba viva; só a ativa aparece. visibility (e não
     display:none) para a aba escondida manter rolagem e layout intactos. */
  .ab-palco { position: relative; flex: 1 1 0; min-height: 0; }
  .ab-fr { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; display: block;
    background: var(--bg); visibility: hidden; }
  .ab-fr.on { visibility: visible; }

  /* Grade de abas (celular) */
  .ab-grade { position: fixed; inset: 0; z-index: 100; display: flex; flex-direction: column; background: var(--bg);
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  .ab-g-topo { flex: none; display: flex; align-items: center; gap: 8px; padding: 10px 12px;
    border-bottom: 1px solid var(--border); }
  .ab-g-topo b { flex: 1; font-size: 15px; }
  .ab-g-topo button { padding: 8px 14px; border-radius: 999px; font-size: 13px; font-weight: 600; cursor: pointer; }
  #ab-g-nova { background: none; border: 1px solid var(--border); color: var(--text-2); }
  #ab-g-ok { background: var(--acc); border: 0; color: var(--acc-txt); }
  .ab-g-lista { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 12px;
    display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-content: start; }
  .ab-card { position: relative; min-height: 92px; padding: 12px 36px 12px 12px; background: var(--card);
    border: 1px solid var(--border); border-radius: 12px; cursor: pointer; }
  .ab-card.on { border-color: var(--acc); box-shadow: 0 0 0 1px var(--acc); }
  .ab-c-t { font-size: 14px; font-weight: 600; line-height: 1.3; color: var(--text); word-break: break-word;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
  .ab-c-u { margin-top: 6px; font-size: 11px; color: var(--text-3);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .ab-c-x { position: absolute; top: 4px; right: 4px; width: 32px; height: 32px; display: grid; place-items: center;
    padding: 0; border: 0; border-radius: 8px; background: none; color: var(--text-3); cursor: pointer; }
</style>
</head>
<body>
<header class="ab-topo">
  <div class="ab-pc">
    <div class="ab-lista" id="ab-lista" role="tablist" aria-label="Abas abertas"></div>
    <button type="button" class="ab-mais" id="ab-mais" aria-label="Nova aba" title="Nova aba"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>
  <div class="ab-movel">
    <button type="button" class="ab-m-titulo" id="ab-m-titulo" aria-label="Ver abas abertas"></button>
    <button type="button" class="ab-m-mais" id="ab-m-mais" aria-label="Nova aba"><svg class="ic" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
    <button type="button" class="ab-m-abas" id="ab-m-abas"><span id="ab-m-n">1</span></button>
  </div>
</header>
<main class="ab-palco" id="ab-palco"></main>
<div class="ab-grade" id="ab-grade" role="dialog" aria-modal="true" aria-label="Abas abertas" hidden>
  <div class="ab-g-topo">
    <b id="ab-g-n"></b>
    <button type="button" id="ab-g-nova">+ Nova aba</button>
    <button type="button" id="ab-g-ok">Pronto</button>
  </div>
  <div class="ab-g-lista" id="ab-g-lista"></div>
</div>

<script>
(function () {
  var CHAVE = 'bariz_abas';
  var BASE = new URL('.', location.href).href;
  var PC = window.matchMedia('(min-width: 768px)');
  var IC_X = "<svg class=\"ic\" width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M6 6l12 12M18 6L6 18\"/></svg>";
  var palco = document.getElementById('ab-palco');
  var lista = document.getElementById('ab-lista');
  var tituloM = document.getElementById('ab-m-titulo');
  var botaoAbas = document.getElementById('ab-m-abas');
  var contador = document.getElementById('ab-m-n');
  var grade = document.getElementById('ab-grade');
  var gradeLista = document.getElementById('ab-g-lista');
  var gradeN = document.getElementById('ab-g-n');
  var frames = {};      // id da aba -> iframe (só as vivas)
  var vivas = [];       // ids das vivas, a usada há mais tempo primeiro
  var estado;           // { abas: [{ id, url, t }], ativa: id }

  // Marca lida pelas páginas (JS_VERSAO, JS_ATUALIZA_ATALHO) para saber que
  // estão dentro de uma aba e deixar o aviso de versão com a casca.
  window.barizAbas = { abre: function (u) { var r = normaliza(u); if (r) abre(r); } };

  function limiteVivas() { return PC.matches ? 12 : 5; }
  function caminho(r) { return r.split(/[?#]/)[0]; }

  function relativo(href) {
    if (href.indexOf(BASE) !== 0) return null;
    return href.slice(BASE.length) || 'index.html';
  }

  // Endereço vindo de fora (#p= do link, localStorage, página) só vira src de
  // iframe se for página DESTE site: um "javascript:" ali rodaria com a origem
  // do portal, com acesso à sessão.
  function normaliza(u, rel) {
    try {
      var x = new URL(u, rel || BASE);
      if (x.protocol !== 'https:' && x.protocol !== 'http:') return null;
      var r = relativo(x.href);
      if (!r) return null;
      return caminho(r) === 'abas.html' ? 'index.html' : r;
    } catch (e) { return null; }
  }

  function ehPagina(r) { return /(\.html?|\/)$/.test(caminho(r)); }

  function nomeDe(r) {
    var p = caminho(r).replace(/(\/index)?\.html?$|\/$/, '').split('/').pop();
    if (!p || p === 'index') return 'Início';
    p = p.replace(/-[0-9a-f]{6}$/, '').replace(/[-_]+/g, ' ');
    return p.charAt(0).toUpperCase() + p.slice(1);
  }

  function tituloDe(doc, r) {
    var t = '';
    try { t = (doc.title || '').trim(); } catch (e) {}
    if (t === 'Bar.IZ — Grupo IZ') return 'Início';
    t = t.replace(/\s*·\s*Bar\.IZ.*$/, '').replace(/\s*[—·]\s*Grupo IZ$/, '').trim();
    return t || nomeDe(r);
  }

  function novoId() { return 'a' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function indice(id) {
    for (var i = 0; i < estado.abas.length; i++) if (estado.abas[i].id === id) return i;
    return -1;
  }
  function acha(id) { var i = indice(id); return i < 0 ? null : estado.abas[i]; }

  function carrega() {
    try {
      var e = JSON.parse(localStorage.getItem(CHAVE) || 'null');
      if (e && e.abas && e.abas.length) {
        var ok = [];
        e.abas.forEach(function (a) {
          var r = a && typeof a.url === 'string' ? normaliza(a.url) : null;
          if (r && typeof a.id === 'string') ok.push({ id: a.id, url: r, t: String(a.t || nomeDe(r)).slice(0, 120) });
        });
        if (ok.length) return { abas: ok, ativa: e.ativa };
      }
    } catch (x) {}
    return { abas: [], ativa: null };
  }
  function salva() { try { localStorage.setItem(CHAVE, JSON.stringify(estado)); } catch (x) {} }

  function criaFrame(a) {
    var f = document.createElement('iframe');
    f.className = 'ab-fr';
    f.title = a.t;
    f.setAttribute('allow', 'fullscreen; camera; microphone; geolocation; clipboard-write; autoplay');
    f.addEventListener('load', function () { aoCarregar(a.id, f); });
    f.src = a.url;
    palco.appendChild(f);
    frames[a.id] = f;
  }

  function descarta(id) {
    var f = frames[id];
    if (f) { f.parentNode.removeChild(f); delete frames[id]; }
    vivas = vivas.filter(function (v) { return v !== id; });
  }

  function aoCarregar(id, f) {
    var a = acha(id);
    if (!a || frames[id] !== f) return;
    var w, doc, href;
    try { w = f.contentWindow; doc = f.contentDocument; href = w.location.href; } catch (e) { return; }
    if (!href || href === 'about:blank') return;
    var r = relativo(href);
    if (r && caminho(r) === 'abas.html') { w.location.replace(BASE + 'index.html'); return; }
    if (r) a.url = r;
    a.t = tituloDe(doc, a.url);
    f.title = a.t;
    engata(w, doc);
    // O Voltar do Android/navegador anda no histórico de QUALQUER iframe,
    // inclusive de aba escondida. Se foi isso que carregou esta aba, ela vem
    // para a frente, em vez de mudar uma página que ninguém está vendo.
    if (id !== estado.ativa) {
      var nav = null;
      try { nav = w.performance.getEntriesByType('navigation')[0]; } catch (e) {}
      if (nav && nav.type === 'back_forward') { ativa(id); return; }
    }
    salva();
    desenha();
  }

  // Link interno "abrir em nova janela" vira aba nova, em vez de sair do app.
  // Externo (WhatsApp, imagem, PDF) segue o caminho normal.
  function engata(w, doc) {
    doc.addEventListener('click', function (ev) {
      if (ev.defaultPrevented || ev.button !== 0) return;
      var el = ev.target && ev.target.closest ? ev.target.closest('a[target="_blank"]') : null;
      if (!el) return;
      var h = el.getAttribute('href') || '';
      if (!h || h.charAt(0) === '#') return;
      var r = normaliza(el.href);
      if (!r || !ehPagina(r)) return;
      ev.preventDefault();
      abre(r);
    });
    var abreOrig = w.open;
    w.open = function (u, alvo) {
      var r = u ? normaliza(String(u), w.location.href) : null;
      if (r && ehPagina(r) && (!alvo || alvo === '_blank')) { abre(r); return null; }
      return abreOrig.apply(w, arguments);
    };
  }

  function ativa(id) {
    var a = acha(id);
    if (!a) return;
    estado.ativa = id;
    if (!frames[id]) criaFrame(a);
    for (var k in frames) frames[k].classList.toggle('on', k === id);
    vivas = vivas.filter(function (v) { return v !== id; });
    vivas.push(id);
    while (vivas.length > limiteVivas()) descarta(vivas[0]);
    salva();
    desenha();
  }

  // Aba nova entra logo depois da atual, como no Chrome.
  function abre(r) {
    var a = { id: novoId(), url: r, t: nomeDe(r) };
    var i = indice(estado.ativa);
    estado.abas.splice(i < 0 ? estado.abas.length : i + 1, 0, a);
    ativa(a.id);
  }

  function fecha(id) {
    var i = indice(id);
    if (i < 0) return;
    estado.abas.splice(i, 1);
    descarta(id);
    if (!estado.abas.length) { estado.ativa = null; abre('index.html'); return; }
    if (estado.ativa === id) { ativa(estado.abas[Math.min(i, estado.abas.length - 1)].id); return; }
    salva();
    desenha();
  }

  function botaoFechar(cls, a) {
    var x = document.createElement('button');
    x.type = 'button';
    x.className = cls;
    x.setAttribute('aria-label', 'Fechar ' + a.t);
    x.title = 'Fechar';
    x.innerHTML = IC_X;
    x.addEventListener('click', function (ev) { ev.stopPropagation(); fecha(a.id); });
    return x;
  }

  function desenha() {
    var atual = acha(estado.ativa), elAtual = null;
    lista.textContent = '';
    estado.abas.forEach(function (a) {
      var on = a.id === estado.ativa;
      var el = document.createElement('div');
      el.className = 'ab-aba' + (on ? ' on' : '');
      el.setAttribute('role', 'tab');
      el.setAttribute('aria-selected', on ? 'true' : 'false');
      el.tabIndex = 0;
      el.title = a.t;
      var t = document.createElement('span');
      t.className = 'ab-t';
      t.textContent = a.t;
      el.appendChild(t);
      el.appendChild(botaoFechar('ab-x', a));
      el.addEventListener('click', function () { if (a.id !== estado.ativa) ativa(a.id); });
      // clique do meio fecha, como no navegador (o mousedown evita a rolagem automática)
      el.addEventListener('mousedown', function (ev) { if (ev.button === 1) ev.preventDefault(); });
      el.addEventListener('auxclick', function (ev) { if (ev.button === 1) { ev.preventDefault(); fecha(a.id); } });
      el.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); ativa(a.id); }
      });
      lista.appendChild(el);
      if (on) elAtual = el;
    });
    if (elAtual && elAtual.scrollIntoView) elAtual.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    var n = estado.abas.length;
    contador.textContent = n > 99 ? '99+' : String(n);
    botaoAbas.setAttribute('aria-label', n + (n === 1 ? ' aba aberta' : ' abas abertas') + '. Ver todas');
    tituloM.textContent = atual ? atual.t : '';
    document.title = (atual ? atual.t + ' · ' : '') + 'Bar.IZ';
    if (!grade.hidden) desenhaGrade();
  }

  function desenhaGrade() {
    var n = estado.abas.length;
    gradeN.textContent = n + (n === 1 ? ' aba' : ' abas');
    gradeLista.textContent = '';
    estado.abas.forEach(function (a) {
      var c = document.createElement('div');
      c.className = 'ab-card' + (a.id === estado.ativa ? ' on' : '');
      c.setAttribute('role', 'button');
      c.tabIndex = 0;
      var t = document.createElement('div');
      t.className = 'ab-c-t';
      t.textContent = a.t;
      var u = document.createElement('div');
      u.className = 'ab-c-u';
      u.textContent = caminho(a.url);
      c.appendChild(t);
      c.appendChild(u);
      c.appendChild(botaoFechar('ab-c-x', a));
      c.addEventListener('click', function () { fechaGrade(); ativa(a.id); });
      c.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); fechaGrade(); ativa(a.id); }
      });
      gradeLista.appendChild(c);
    });
  }

  // A grade ocupa uma entrada no histórico: o Voltar do Android fecha a grade
  // em vez de sair do app.
  var gradeNoHistorico = false;
  function abreGrade() {
    grade.hidden = false;
    desenhaGrade();
    try { history.pushState({ abGrade: 1 }, ''); gradeNoHistorico = true; } catch (e) {}
  }
  function fechaGrade() {
    if (grade.hidden) return;
    grade.hidden = true;
    if (gradeNoHistorico) { gradeNoHistorico = false; try { history.back(); } catch (e) {} }
  }
  window.addEventListener('popstate', function () {
    if (!grade.hidden) { gradeNoHistorico = false; grade.hidden = true; }
  });

  document.getElementById('ab-mais').addEventListener('click', function () { abre('index.html'); });
  document.getElementById('ab-m-mais').addEventListener('click', function () { abre('index.html'); });
  botaoAbas.addEventListener('click', abreGrade);
  tituloM.addEventListener('click', abreGrade);
  document.getElementById('ab-g-nova').addEventListener('click', function () { fechaGrade(); abre('index.html'); });
  document.getElementById('ab-g-ok').addEventListener('click', fechaGrade);
  // duplo clique no vazio da barra abre aba nova (Chrome/Notion)
  lista.addEventListener('dblclick', function (ev) { if (ev.target === lista) abre('index.html'); });
  document.addEventListener('keydown', function (ev) { if (ev.key === 'Escape') fechaGrade(); });
  var aoMudarTela = function () { while (vivas.length > limiteVivas()) descarta(vivas[0]); };
  if (PC.addEventListener) PC.addEventListener('change', aoMudarTela); else if (PC.addListener) PC.addListener(aoMudarTela);

  // Título e endereço mudam sem recarregar (#hash, document.title por JS):
  // confere a aba visível de tempos em tempos.
  setInterval(function () {
    if (document.hidden) return;
    var a = acha(estado.ativa), f = frames[estado.ativa];
    if (!a || !f) return;
    try {
      var r = relativo(f.contentWindow.location.href);
      if (!r || caminho(r) === 'abas.html') return;
      var t = tituloDe(f.contentDocument, r);
      if (r !== a.url || t !== a.t) { a.url = r; a.t = t; f.title = t; salva(); desenha(); }
    } catch (e) {}
  }, 1500);

  // #p=<página> (vindo do ABAS_GUARDA) abre essa página: ativa a aba que já
  // mostra ela, senão cria uma no fim. A home pura (atalho antigo do app) só
  // restaura, para não juntar uma aba "Início" a cada vez que o app abre.
  // Vale na carga e também com a casca já aberta (aí só o hash muda).
  function atendePedido() {
    var pedido = null, m = /[#&]p=([^&]*)/.exec(location.hash);
    if (m) { try { pedido = normaliza(decodeURIComponent(m[1])); } catch (e) {} }
    if (location.hash) { try { history.replaceState(history.state, '', location.pathname + location.search); } catch (e) {} }
    if (!pedido) return;
    var ja = null;
    estado.abas.forEach(function (a) { if (a.url === pedido) ja = a; });
    if (ja) estado.ativa = ja.id;
    else if (!(pedido === 'index.html' && estado.abas.length)) {
      var nova = { id: novoId(), url: pedido, t: nomeDe(pedido) };
      estado.abas.push(nova);
      estado.ativa = nova.id;
    }
  }
  window.addEventListener('hashchange', function () {
    if (!/[#&]p=/.test(location.hash)) return;
    fechaGrade();
    atendePedido();
    ativa(estado.ativa);
  });

  estado = carrega();
  atendePedido();
  if (!estado.abas.length) estado.abas.push({ id: novoId(), url: 'index.html', t: 'Início' });
  if (!acha(estado.ativa)) estado.ativa = estado.abas[0].id;
  ativa(estado.ativa);
})();
</script>


<script>
if ('serviceWorker' in navigator) {
  window.addEventListener('load', function () {
    navigator.serviceWorker.register('sw.js').catch(function () {});
  });
}
</script>


<style>
  /* var(--x, fallback) em tudo: este mesmo bloco é reusado nas subpastas
     (Minha Central, Contador de Evento), que têm paleta própria — e a
     ausência de uma variável não pode deixar o aviso ilegível. */
  .ver-nova { position: fixed; left: 12px; right: 12px; top: calc(10px + env(safe-area-inset-top, 0px));
    z-index: 96; margin: 0 auto; max-width: 460px; display: none;
    background: #2c2416; border: 1px solid var(--acc, #d8b26e); border-radius: 12px;
    padding: 10px 12px; box-shadow: 0 8px 24px rgba(0,0,0,.45);
    align-items: center; gap: 10px; }
  .ver-nova.on { display: flex; }
  .ver-nova svg { flex: none; color: var(--acc, #d8b26e); }
  .vn-txt { flex: 1; font-size: 12.5px; color: var(--text-2, #c9cdd6); line-height: 1.4; }
  .vn-txt b { color: var(--text, #f3ede2); }
  .vn-ok { flex: none; font-size: 12px; font-weight: 600; padding: 7px 12px;
    border-radius: 999px; cursor: pointer; background: var(--acc, #d8b26e); border: none;
    color: var(--acc-txt, #16130f); }
  .vn-x { flex: none; background: none; border: none; color: var(--text-2, #c9cdd6);
    font-size: 18px; line-height: 1; cursor: pointer; padding: 2px 4px; }
</style>
<div class="ver-nova" id="ver-nova" role="status" aria-live="polite">
  <svg class="ic" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 3.5V9h-5.5"/></svg>
  <div class="vn-txt"><b>Nova versão disponível.</b> Atualize pra ver o conteúdo mais recente.</div>
  <button type="button" class="vn-ok" id="vn-ok">Atualizar</button>
  <button type="button" class="vn-x" id="vn-x" aria-label="Dispensar">&times;</button>
</div>
<script>
(function () {
  var BUILD = '4d83f408dd21';
  var ALVO = 'versao.json';
  var MIN_ENTRE = 60000;      // não martelar a rede a cada troca de aba
  // Dispensar é ADIAR, nunca silenciar. Num app instalado (standalone),
  // reabrir pelo alternador não refaz navegação nenhuma — este aviso é o
  // ÚNICO caminho de atualização daquele aparelho. Um "x" definitivo prendia
  // o aparelho na versão velha pra sempre (aconteceu de verdade). Guardamos
  // "<build>|<carimbo>" e o adiamento vence sozinho.
  var ADIA_MS = 86400000;     // 24h
  var ultimo = 0, mostrando = false;

  // Dentro da casca de abas (abas.html, ver ABAS_JS) quem confere versão é a
  // casca: um aviso por aba empilharia N avisos iguais, e o "Atualizar" de
  // uma aba só recarregaria ela, deixando as outras no build velho. O botão
  // manual de meu-perfil.html continua funcionando, repassado pra casca.
  var casca = null;
  try { if (window.top !== window.self && window.top.barizAbas) casca = window.top; } catch (e) {}
  if (casca) {
    window.barizAtualiza = function () { casca.barizAtualiza(); };
    window.barizConfere = function () { casca.barizConfere(); };
    return;
  }

  // Fail-open: qualquer dúvida (localStorage indisponível, valor estranho,
  // formato legado só com o build) resulta em MOSTRAR o aviso.
  function adiado(novo) {
    try {
      var v = localStorage.getItem('bariz_build_dispensado');
      if (!v) return false;
      var p = String(v).split('|');
      if (p.length < 2) return false;        // legado: tratado como expirado
      if (p[0] !== novo) return false;       // build diferente: aviso novo
      var quando = parseInt(p[1], 10);
      if (!quando) return false;
      var dif = Date.now() - quando;
      return dif >= 0 && dif < ADIA_MS;      // relógio pra trás: mostra
    } catch (e) { return false; }
  }

  function mostra(novo) {
    if (mostrando) return;
    if (adiado(novo)) return;
    var box = document.getElementById('ver-nova');
    // a trava só liga DEPOIS de haver caixa: ligada antes, uma página sem o
    // markup do aviso mataria toda conferência seguinte daquela carga.
    if (!box) return;
    mostrando = true;
    box.classList.add('on');
    document.getElementById('vn-x').onclick = function () {
      try {
        localStorage.setItem('bariz_build_dispensado', novo + '|' + Date.now());
      } catch (e) {}
      // solta a trava: quem silencia daqui pra frente é adiado(), com prazo.
      // Sem isto, confere() (que começa em `if (mostrando) return`) morria no
      // primeiro "x" e nem o intervalo de 10 min nem o visibilitychange
      // voltavam — o adiamento nunca venceria num app standalone, que é
      // justamente o aparelho que só tem este aviso como caminho.
      mostrando = false;
      box.classList.remove('on');
    };
    document.getElementById('vn-ok').onclick = atualiza;
  }

  // Limpa TODOS os caches do service worker e recarrega. Sem isso um reload
  // comum ainda seria atendido pela casca cacheada (css/ícones).
  function atualiza() {
    var feito = false;
    var recarrega = function () { if (feito) return; feito = true; location.reload(); };
    setTimeout(recarrega, 2500);   // rede travada não pode prender o usuário
    var t = [];
    try {
      if (window.caches && caches.keys) {
        t.push(caches.keys().then(function (ks) {
          return Promise.all(ks.map(function (k) { return caches.delete(k); }));
        }));
      }
      if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
        t.push(navigator.serviceWorker.getRegistration().then(function (r) { return r && r.update(); }));
      }
    } catch (e) {}
    Promise.all(t).then(recarrega, recarrega);
  }

  function confere() {
    if (mostrando) return;
    var agora = Date.now();
    if (agora - ultimo < MIN_ENTRE) return;
    ultimo = agora;
    fetch(ALVO + '?t=' + agora, { cache: 'no-store' })
      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (d) { if (d && d.build && d.build !== BUILD) mostra(d.build); })
      .catch(function () {});
  }

  // Exposto pro botão manual "Buscar atualização" (meu-perfil.html).
  window.barizAtualiza = atualiza;
  window.barizConfere = function () { ultimo = 0; confere(); };

  setTimeout(confere, 4000);                       // não competir com o render
  setInterval(function () { if (!document.hidden) confere(); }, 600000);
  document.addEventListener('visibilitychange', function () {
    // o caso que só isto alcança: app em standalone voltando do alternador.
    if (!document.hidden) confere();
  });
})();
</script>


<style>
  /* bottom: acima do radio-mini/pomo-mini (pills fixas nos cantos, ~44px de
     altura a partir de 14px do rodapé, z-index 94) — não competir por
     z-index com eles, só não ocupar o mesmo espaço na tela. */
  .atualiza-atalho { position: fixed; left: 12px; right: 12px;
    bottom: calc(70px + env(safe-area-inset-bottom, 0px)); z-index: 40;
    background: #2c2416; border: 1px solid var(--acc); border-radius: 12px; padding: 12px 14px;
    box-shadow: 0 8px 24px rgba(0,0,0,.45); display: none; }
  .atualiza-atalho.on { display: block; }
  .aa-topo { display: flex; align-items: flex-start; gap: 10px; }
  .aa-topo svg { flex: none; color: var(--acc); margin-top: 1px; }
  .aa-txt { flex: 1; font-size: 12.5px; color: var(--text-2); line-height: 1.5; }
  .aa-txt b { color: var(--text); }
  .aa-botoes { display: flex; gap: 8px; margin-top: 10px; }
  .aa-botoes button { flex: none; font-size: 12px; font-weight: 600; padding: 7px 12px;
    border-radius: 999px; cursor: pointer; }
  #aa-como { background: none; border: 1px solid var(--border); color: var(--text-2); }
  #aa-ok { background: var(--acc); border: none; color: var(--acc-txt); }
  .aa-passos { display: none; margin: 10px 0 0; padding-left: 18px; font-size: 12px;
    color: var(--text-2); line-height: 1.6; }
  .aa-passos.on { display: block; }
</style>
<div class="atualiza-atalho" id="atualiza-atalho">
  <div class="aa-topo">
    <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3.5l9 15.5H3z"/><path d="M12 10v4M12 16.5h.01"/></svg>
    <div class="aa-txt"><b>Atualizamos o ícone e o nome do app</b> (agora é Bar.IZ). Seu atalho na
    tela de início ficou com o visual antigo — o celular só atualiza isso se você reinstalar.</div>
  </div>
  <ol class="aa-passos" id="aa-passos"></ol>
  <div class="aa-botoes">
    <button type="button" id="aa-como">Como fazer</button>
    <button type="button" id="aa-ok">Entendi</button>
  </div>
</div>
<script>
(function () {
  var STANDALONE = window.navigator.standalone === true
    || window.matchMedia('(display-mode: standalone)').matches;
  if (!STANDALONE) return;
  // dentro de uma aba da casca (abas.html) o aviso sai só uma vez, pela casca
  try { if (window.top !== window.self && window.top.barizAbas) return; } catch (e) {}
  var V = 'bariz-1';
  if (localStorage.getItem('atalho_icone_v') === V) return;
  var box = document.getElementById('atualiza-atalho');
  var passos = document.getElementById('aa-passos');
  var ehIOS = window.navigator.standalone !== undefined;
  var PASSOS_IOS = [
    'Feche este app e volte pra tela de início.',
    'Toque e segure o ícone antigo até aparecer o menu.',
    '"Remover App" (ou "Excluir Atalho").',
    'Abra o link do Bar.IZ no Safari (não pelo atalho antigo).',
    'Toque em Compartilhar e depois em "Adicionar à Tela de Início".',
  ];
  var PASSOS_ANDROID = [
    'Toque e segure o ícone antigo até aparecer o menu.',
    '"Remover" ou "Desinstalar".',
    'Abra o link do Bar.IZ no Chrome.',
    'Menu (⋮) → "Adicionar à tela inicial" ou "Instalar app".',
  ];
  (ehIOS ? PASSOS_IOS : PASSOS_ANDROID).forEach(function (texto) {
    var li = document.createElement('li');
    li.textContent = texto;
    passos.appendChild(li);
  });
  document.getElementById('aa-como').addEventListener('click', function () {
    passos.classList.toggle('on');
  });
  document.getElementById('aa-ok').addEventListener('click', function () {
    localStorage.setItem('atalho_icone_v', V);
    box.classList.remove('on');
  });
  box.classList.add('on');
})();
</script>
